<!doctype html>
<html lang="en" class="tw-min-w-[320px] tw-bg-black tw-[color-scheme:dark]">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>Reset password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="tw-m-0 tw-grid tw-min-h-screen tw-place-items-center tw-bg-black tw-p-5 tw-font-sans tw-text-white">
<main class="tw-w-[min(430px,100%)] tw-rounded-2xl tw-border tw-border-solid tw-border-tt-border tw-bg-[#0b0b0b] tw-p-8">
    <h1 class="tw-m-0 tw-mb-2 tw-font-league tw-text-[48px] tw-font-normal">NEW PASSWORD</h1>
    <p class="tw-m-0 tw-mb-5 tw-text-tt-muted">Choose a new password with at least 10 characters.</p>
    {% if error %}<div class="tw-mb-4 tw-border tw-border-solid tw-border-tt-dangerBorder tw-bg-tt-dangerBg tw-p-3 tw-text-sm tw-text-tt-danger">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('phase4_reset_password_post') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="token" value="{{ token }}">
        <label class="tw-mb-2 tw-block tw-text-sm" for="password">New password</label>
        <input class="tw-w-full tw-min-h-[48px] tw-rounded-lg tw-border tw-border-solid tw-border-[#2b2b2b] tw-bg-[#111] tw-px-3 tw-text-white" id="password" name="password" type="password" minlength="10" required autocomplete="new-password">
        <label class="tw-mb-2 tw-mt-4 tw-block tw-text-sm" for="confirm-password">Confirm new password</label>
        <input class="tw-w-full tw-min-h-[48px] tw-rounded-lg tw-border tw-border-solid tw-border-[#2b2b2b] tw-bg-[#111] tw-px-3 tw-text-white" id="confirm-password" name="confirm_password" type="password" minlength="10" required autocomplete="new-password">
        <button class="tw-mt-5 tw-min-h-[48px] tw-w-full tw-rounded-lg tw-border-0 tw-bg-white tw-font-bold tw-text-black" type="submit">RESET PASSWORD</button>
    </form>
</main>
</body>
</html>
