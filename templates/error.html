<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>{{ status_code }} - TV Tracker</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/icons/favicon.svg') }}">
    <style>
        @font-face{font-family:"League Gothic";src:url("{{ url_for('static', filename='assets/league-gothic.regular.ttf') }}") format("truetype");font-display:swap}
        *{box-sizing:border-box}
        html{min-width:320px;background:#000;color-scheme:dark}
        body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));overflow-x:hidden;background:radial-gradient(circle at top,#151515 0,#000 42%,#000 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center}
        main{width:min(500px,100%);border:1px solid #242424;background:linear-gradient(180deg,#0b0b0b 0,#070707 100%);padding:38px 34px;border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.62)}
        .status{margin:0 0 12px;color:#777;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
        h1{margin:0 0 12px;font-family:"League Gothic",sans-serif;font-size:58px;font-weight:400;letter-spacing:.03em;line-height:.95}
        p{margin:0 auto;color:#aaa;font-size:16px;line-height:1.6}
        a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:28px;border:1px solid #fff;background:#fff;color:#000;padding:12px 18px;border-radius:10px;font-weight:800;text-decoration:none;transition:background .16s ease,transform .16s ease}
        a:hover{background:#d8d8d8;transform:translateY(-1px)}
        a:focus-visible{outline:2px solid #fff;outline-offset:3px}
        @media (max-width:480px){main{padding:30px 24px}h1{font-size:48px}}
    </style>
</head>
<body>
<main>
    <p class="status">{{ status_code }}</p>
    <h1>{{ error_title }}</h1>
    <p>{{ error_text }}</p>
    <a href="{{ action_url }}">{{ action_label }}</a>
</main>
</body>
</html>
