<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="app-route" content="{{ initial_app_path }}">

<title>TV Tracker</title>

<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/icons/favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css', v='2.0-tailwind') }}">
</head>

<body class="app-shell tw-antialiased" data-theme="tvtracker">

<aside class="sidebar" id="app-sidebar">
    <nav class="sidebar-nav app-primary-nav" aria-label="Primary navigation">
        <a data-page="shows" href="/app/list/watching">
            SHOWS
        </a>

        <a data-page="discover" href="/app/discover">
            DiSCOVER
        </a>

        <a data-page="profile" href="/app/profile">
            PROFILE
        </a>

        <a class="sidebar-settings-button" data-page="settings" href="/app/settings">
            SETTINGS
        </a>
    </nav>
</aside>

<nav class="mobile-bottom-nav app-primary-nav" aria-label="Primary navigation">
    <a data-page="shows" href="/app/list/watching">SHOWS</a>
    <a data-page="discover" href="/app/discover">DiSCOVER</a>
    <a data-page="profile" href="/app/profile">PROFILE</a>
    <a data-page="settings" href="/app/settings">SETTINGS</a>
</nav>

<section class="main">



<!-- SHOWS PAGE -->

<div id="shows-page" class="page">

    <nav class="top-tabs">

      <a data-tab="watchlist" href="/app/list/watching">
        WATCHLIST
      </a>

      <a data-tab="upcoming" href="/app/upcoming">
        UPCOMING
      </a>

      <a data-tab="history" href="/app/history">
        HISTORY
     </a>

    </nav>



    <div class="filters">

        <div class="status-filter-track">
            <a data-filter="watching" href="/app/list/watching">
                Watching
            </a>

            <a data-filter="paused" href="/app/list/paused">
                Paused
            </a>

            <a data-filter="finished" href="/app/list/completed">
                Completed
            </a>

            <a data-filter="plan" href="/app/list/plan-to-watch">
                Plan To Watch
            </a>

            <a data-filter="dropped" href="/app/list/dropped">
                Dropped
            </a>
        </div>

    </div>



    <main class="content" id="show-list">
        <div class="watchlist-initial-skeleton" role="status" aria-live="polite" aria-label="Loading shows">
            {% for _ in range(5) %}
            <article class="watchlist-skeleton-row" aria-hidden="true">
                <div class="watchlist-skeleton-block watchlist-skeleton-poster"></div>
                <div class="watchlist-skeleton-content">
                    <div class="watchlist-skeleton-block watchlist-skeleton-title watchlist-skeleton-title--{{ loop.index }}"></div>
                    <div class="watchlist-skeleton-block watchlist-skeleton-episode watchlist-skeleton-episode--{{ loop.index }}"></div>
                    <div class="watchlist-skeleton-block watchlist-skeleton-meta watchlist-skeleton-meta--{{ loop.index }}"></div>
                </div>
                <div class="watchlist-skeleton-block watchlist-skeleton-action"></div>
            </article>
            {% endfor %}
            <span class="watchlist-skeleton-sr">Loading shows…</span>
        </div>
    </main>

</div>





<!-- DISCOVER PAGE -->

<div id="discover-page" class="page">

    <div class="search-container">

        <input
        class="search-bar"
        id="search"
        name="tv_tracker_show_search"
        type="search"
        placeholder="Search TV shows"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        inputmode="search"
        data-lpignore="true"
        data-1p-ignore="true"
        data-form-type="other"
        >

        <div class="search-results" id="search-results"></div>

    </div>

</div>





<!-- PROFILE PAGE -->

<div id="profile-page" class="page">

    <div class="profile" id="profile-content"></div>

</div>



<!-- SETTINGS PAGE -->

<div id="settings-page" class="page">

    <div class="settings" id="settings-content"></div>

</div>



<!-- SHOW DETAIL PAGE -->

<div id="show-detail-page" class="page show-detail-page">

    <div class="show-detail-page-content" id="show-detail-content"></div>

</div>


<!-- GENRE DETAIL PAGE -->

<div id="genre-detail-page" class="page genre-detail-page">

    <div class="genre-detail-page-content" id="genre-detail-content"></div>

</div>


<!-- PERSON DETAIL PAGE -->

<div id="person-detail-page" class="page genre-detail-page person-detail-page">

    <div class="genre-detail-page-content" id="person-detail-content"></div>

</div>


<!-- EPISODE DETAIL PAGE -->

<div id="episode-detail-page" class="page episode-detail-page">

    <div class="episode-detail-page-content" id="episode-detail-content"></div>

</div>



</section>





<!-- STATUS POPUP -->

<div class="popup-overlay" id="status-popup">

    <div class="popup">

        <h2 id="popup-title">
            Add Show
        </h2>

        <p>
            Choose status:
        </p>

        <div class="popup-buttons">

            <button data-status="watching">
                Watching
            </button>

            <button data-status="plan">
                Plan To Watch
            </button>

            <button data-status="finished">
                Completed
            </button>

            <button data-status="paused">
                Paused
            </button>
			
			<button data-status="dropped">
			Dropped    
			</button>
				

        </div>

        <button class="close-popup" id="close-popup">
            Cancel
        </button>

    </div>

</div>


<!-- SHOW DETAIL MODAL -->

<div class="show-modal-overlay" id="show-modal">

    <div class="show-modal">

        <button class="show-modal-close" id="close-show-modal">
            ×
        </button>

        <div id="show-modal-content"></div>

    </div>

</div>


<!-- FAVORITES POPUP -->

<div class="popup-overlay" id="favorites-popup">

    <div class="popup favorites-popup-box">

        <h2 id="favorites-popup-title">Favorite Shows</h2>

        <p id="favorites-popup-description">Choose up to 8 favorite shows.</p>

        <div id="favorites-popup-content"></div>

        <button class="close-popup" id="close-favorites-popup">
            Close
        </button>

    </div>

</div>


<!-- TOAST -->

<div class="app-toast" id="toast" role="status" aria-live="polite"></div>





<script src="{{ url_for('static', filename='js/config.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/audit-utils.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/pending-save-store.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/db.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/tmdb.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/show-detail-filters.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/ui.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/discover-browse.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/app.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/history-activity.js', v='2.0-tailwind') }}"></script>
<script src="{{ url_for('static', filename='js/app-router.js', v='2.0-tailwind') }}"></script>

</body>
</html>
