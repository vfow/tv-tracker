<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="csrf-token" content="{{ csrf_token }}">

<title>TV Tracker</title>

<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon.svg') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/foundation.css', v='1.2.0') }}">
</head>

<body class="app-shell">

<header class="mobile-app-bar d-lg-none" aria-label="Application header">
    <button
        class="mobile-menu-button"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#app-sidebar"
        aria-controls="app-sidebar"
        aria-label="Open navigation"
    >
        <span class="mobile-menu-icon" aria-hidden="true"></span>
    </button>

    <div class="mobile-app-copy">
        <span class="mobile-app-name">TV Tracker</span>
        <span class="mobile-page-title" id="mobile-page-title">Watchlist</span>
    </div>
</header>

<aside
    class="sidebar offcanvas-lg offcanvas-start"
    id="app-sidebar"
    tabindex="-1"
    aria-labelledby="app-sidebar-title"
>
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <span class="sidebar-brand-kicker">Private library</span>
            <span class="sidebar-brand-title" id="app-sidebar-title">TV TRACKER</span>
        </div>

        <button
            class="sidebar-close btn-close btn-close-white d-lg-none"
            type="button"
            data-bs-dismiss="offcanvas"
            aria-label="Close navigation"
        ></button>
    </div>

    <nav class="sidebar-nav" aria-label="Primary navigation">
        <button class="active" data-page="shows" aria-current="page">
            SHOWS
        </button>

        <button data-page="discover">
            DISCOVER
        </button>

        <button data-page="profile">
            PROFILE
        </button>

        <button class="sidebar-settings-button" data-page="settings">
            SETTINGS
        </button>
    </nav>
</aside>




<section class="main">



<!-- SHOWS PAGE -->

<div id="shows-page" class="page active-page">

    <nav class="top-tabs">

      <button class="active" data-tab="watchlist">
        WATCHLIST
      </button>

      <button data-tab="upcoming">
        UPCOMING
      </button>

      <button data-tab="history">
        HISTORY
     </button>

    </nav>



    <div class="filters">

        <button class="active" data-filter="watching">
            Watching
        </button>

        <button data-filter="paused">
            Paused
        </button>

        <button data-filter="finished">
            Completed
        </button>

        <button data-filter="plan">
            Plan To Watch
        </button>

        <button data-filter="dropped">
            Dropped
        </button>

    </div>



    <main class="content" id="show-list"></main>

</div>





<!-- DISCOVER PAGE -->

<div id="discover-page" class="page">

    <div class="search-container">

        <input
        class="search-bar"
        id="search"
        placeholder="Search TV shows..."
        >

        <div class="search-results" id="search-results"></div>

    </div>

</div>





<!-- PROFILE PAGE -->

<div id="profile-page" class="page">

    <div class="profile" id="profile-content"></div>

</div>



<!-- SETTINGS PAGE -->

<div id="settings-page" class="page">

    <div class="settings" id="settings-content"></div>

</div>



</section>





<!-- STATUS POPUP -->

<div class="popup-overlay" id="status-popup">

    <div class="popup">

        <h2 id="popup-title">
            Add Show
        </h2>

        <p>
            Choose status:
        </p>

        <div class="popup-buttons">

            <button data-status="watching">
                Watching
            </button>

            <button data-status="plan">
                Plan To Watch
            </button>

            <button data-status="finished">
                Completed
            </button>

            <button data-status="paused">
                Paused
            </button>
			
			<button data-status="dropped">
			Dropped    
			</button>
				

        </div>

        <button class="close-popup" id="close-popup">
            Cancel
        </button>

    </div>

</div>


<!-- SHOW DETAIL MODAL -->

<div class="show-modal-overlay" id="show-modal">

    <div class="show-modal">

        <button class="show-modal-close" id="close-show-modal">
            ×
        </button>

        <div id="show-modal-content"></div>

    </div>

</div>


<!-- FAVORITES POPUP -->

<div class="popup-overlay" id="favorites-popup">

    <div class="popup favorites-popup-box">

        <h2>Favorite Shows</h2>

        <p>Choose up to 8 favorite shows.</p>

        <div id="favorites-popup-content"></div>

        <button class="close-popup" id="close-favorites-popup">
            Close
        </button>

    </div>

</div>


<!-- TOAST -->

<div class="app-toast" id="toast" role="status" aria-live="polite"></div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='js/shell.js', v='1.2.0') }}"></script>
<script src="{{ url_for('static', filename='js/config.js') }}"></script>
<script src="{{ url_for('static', filename='js/db.js') }}"></script>
<script src="{{ url_for('static', filename='js/tmdb.js') }}"></script>
<script src="{{ url_for('static', filename='js/ui.js', v='1.2.0') }}"></script>
<script src="{{ url_for('static', filename='js/app.js', v='1.2.0') }}"></script>

</body>
</html>
