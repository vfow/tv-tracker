<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="app-route" content="{{ initial_app_path }}">
<meta name="frontend-build" content="2.0-tailwind">
<meta name="notification-bell-icon" content="{{ url_for('static', filename='assets/icons/notification-bell.svg') }}">
<meta name="notification-settings-icon" content="{{ url_for('static', filename='assets/icons/notification-settings.svg') }}">

<title>Library</title>

<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/icons/favicon.svg') }}">
<link rel="preload" href="{{ url_for('static', filename='assets/league-gothic.regular.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/notifications-nav.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/settings-v2.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/feedback.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/runtime-health.css') }}">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/icons/app-icon-192.png') }}">
</head>

<body class="app-shell tw-antialiased" data-theme="tvtracker">

<aside class="sidebar" id="app-sidebar">
    <nav class="sidebar-nav app-primary-nav" aria-label="Primary navigation">
        <a class="tw-font-league" data-page="shows" href="/app/list/watching">
            SHOWS
        </a>

        <a class="tw-font-league" data-page="discover" href="/app/discover">
            DiSCOVER
        </a>

        <a class="sidebar-notifications-link tw-font-league" data-page="notifications" href="/app/notifications">
            <span class="sidebar-notifications-label">NOTiFiCATIONS<span class="notification-unread-dot sidebar-notification-unread-dot" aria-hidden="true" hidden></span></span>
        </a>

        <a class="tw-font-league" data-page="profile" href="/app/profile">
            PROFILE
        </a>

        <a class="sidebar-settings-button tw-font-league" data-page="settings" href="/app/settings">
            SETTINGS
        </a>
    </nav>
</aside>

<nav class="mobile-bottom-nav app-primary-nav" aria-label="Primary navigation">
    <a class="tw-font-league" data-page="shows" href="/app/list/watching">SHOWS</a>
    <a class="tw-font-league" data-page="discover" href="/app/discover">DiSCOVER</a>
    <a class="tw-font-league" data-page="profile" href="/app/profile">PROFILE</a>
    <a class="tw-font-league" data-page="settings" href="/app/settings">SETTINGS</a>
</nav>

<main class="main" id="app-main">

<div id="tv-tracker-startup-status" role="alert" aria-live="assertive" hidden></div>

<!-- SHOWS PAGE -->
<div id="shows-page" class="page">
    <nav class="top-tabs" aria-label="Show sections">
      <a class="tw-font-league" data-tab="watchlist" href="/app/list/watching">WATCHLIST</a>
      <a class="tw-font-league" data-tab="upcoming" href="/app/upcoming">UPCOMING</a>
      <a class="tw-font-league" data-tab="history" href="/app/history">HISTORY</a>
    </nav>

    <div class="filters">
        <div class="status-filter-track">
            <a data-filter="watching" href="/app/list/watching">Watching</a>
            <a data-filter="paused" href="/app/list/paused">Paused</a>
            <a data-filter="finished" href="/app/list/completed">Completed</a>
            <a data-filter="plan" href="/app/list/plan-to-watch">Plan To Watch</a>
            <a data-filter="dropped" href="/app/list/dropped">Dropped</a>
        </div>
    </div>

    <div class="content" id="show-list">
        <div class="watchlist-initial-skeleton" role="status" aria-live="polite" aria-label="Loading shows">
            {% for _ in range(5) %}
            <article class="watchlist-skeleton-row" aria-hidden="true">
                <div class="watchlist-skeleton-block watchlist-skeleton-poster"></div>
                <div class="watchlist-skeleton-content">
                    <div class="watchlist-skeleton-block watchlist-skeleton-title watchlist-skeleton-title--{{ loop.index }}"></div>
                    <div class="watchlist-skeleton-block watchlist-skeleton-episode watchlist-skeleton-episode--{{ loop.index }}"></div>
                    <div class="watchlist-skeleton-block watchlist-skeleton-meta watchlist-skeleton-meta--{{ loop.index }}"></div>
                </div>
                <div class="watchlist-skeleton-block watchlist-skeleton-action"></div>
            </article>
            {% endfor %}
            <span class="watchlist-skeleton-sr">Loading shows…</span>
        </div>
    </div>
</div>

<!-- DISCOVER PAGE -->
<div id="discover-page" class="page">
    <div class="search-container">
        <input
        class="search-bar"
        id="search"
        name="tv_tracker_show_search"
        type="search"
        placeholder="Search shows, movies, people, collections"
        aria-label="Search TV shows, movies, people, and collections"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        inputmode="search"
        data-lpignore="true"
        data-1p-ignore="true"
        data-form-type="other"
        >
        <div class="search-results" id="search-results"></div>
    </div>
</div>

<!-- PROFILE PAGE -->
<div id="profile-page" class="page">
    <div class="profile" id="profile-content"></div>
</div>

<!-- SETTINGS PAGE -->
<div id="settings-page" class="page">
    <div class="settings" id="settings-content"></div>
</div>

<!-- NOTIFICATIONS PAGE -->
<div id="notifications-page" class="page notifications-page">
    <div id="notifications-content"></div>
</div>

<!-- SHOW DETAIL PAGE -->
<div id="show-detail-page" class="page show-detail-page">
    <div class="show-detail-page-content" id="show-detail-content"></div>
</div>

<!-- GENRE DETAIL PAGE -->
<div id="genre-detail-page" class="page genre-detail-page">
    <div class="genre-detail-page-content" id="genre-detail-content"></div>
</div>

<!-- PERSON DETAIL PAGE -->
<div id="person-detail-page" class="page genre-detail-page person-detail-page">
    <div class="genre-detail-page-content" id="person-detail-content"></div>
</div>

<!-- EPISODE DETAIL PAGE -->
<div id="episode-detail-page" class="page episode-detail-page">
    <div class="episode-detail-page-content" id="episode-detail-content"></div>
</div>
</main>

<!-- STATUS POPUP -->
<div class="popup-overlay" id="status-popup" aria-hidden="true">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title" tabindex="-1">
        <h2 id="popup-title">Add Show</h2>
        <p>Choose status:</p>
        <div class="popup-buttons">
            <button data-status="watching">Watching</button>
            <button data-status="plan">Plan To Watch</button>
            <button data-status="finished">Completed</button>
            <button data-status="paused">Paused</button>
            <button data-status="dropped">Dropped</button>
        </div>
        <button class="close-popup" id="close-popup" type="button">Cancel</button>
    </div>
</div>

<!-- SHOW DETAIL MODAL -->
<div class="show-modal-overlay" id="show-modal" aria-hidden="true">
    <div class="show-modal" role="dialog" aria-modal="true" aria-label="Show details" tabindex="-1">
        <button class="show-modal-close" id="close-show-modal" type="button" aria-label="Close details">×</button>
        <div id="show-modal-content"></div>
    </div>
</div>

<!-- FAVORITES POPUP -->
<div class="popup-overlay" id="favorites-popup" aria-hidden="true">
    <div class="popup favorites-popup-box" role="dialog" aria-modal="true" aria-labelledby="favorites-popup-title" tabindex="-1">
        <h2 id="favorites-popup-title">Favorite Shows</h2>
        <p id="favorites-popup-description">Choose up to 8 favorite shows.</p>
        <div id="favorites-popup-content"></div>
        <button class="close-popup" id="close-favorites-popup" type="button">Close</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/config.js') }}"></script>
<script src="{{ url_for('static', filename='js/audit-utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/pending-save-store.js') }}"></script>

<script src="{{ url_for('static', filename='js/db.js') }}"></script>

<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
<script src="{{ url_for('static', filename='js/feedback.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/foundation.js') }}"></script>
<script src="{{ url_for('static', filename='js/discover-browse.js') }}"></script>

<script src="{{ url_for('static', filename='js/movie-details-native-panels.js') }}"></script>
<script src="{{ url_for('static', filename='js/movie-details-vue-bridge.js') }}"></script>
<script src="{{ url_for('static', filename='js/show-details-vue-bridge.js') }}"></script>
<script src="{{ url_for('static', filename='js/search-state-bridge.js') }}"></script>

<script src="{{ url_for('static', filename='js/app-router.js') }}"></script>
<script src="{{ url_for('static', filename='js/notifications-nav.js') }}"></script>
<script src="{{ url_for('static', filename='js/interaction-quality.js') }}"></script>
<script src="{{ url_for('static', filename='js/startup.js') }}"></script>

</body>
</html>
