<!doctype html>
<html lang="en" class="tw-min-w-[320px] tw-bg-black tw-[color-scheme:dark]">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>{{ title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/icons/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="tw-m-0 tw-grid tw-min-h-screen tw-place-items-center tw-bg-black tw-p-5 tw-font-sans tw-text-white">
<main class="tw-w-[min(430px,100%)] tw-rounded-2xl tw-border tw-border-solid tw-border-tt-border tw-bg-[#0b0b0b] tw-p-8 tw-shadow-2xl tw-shadow-black/60">
    <h1 class="tw-m-0 tw-mb-3 tw-font-league tw-text-[48px] tw-font-normal tw-leading-none">{{ title }}</h1>
    <p class="tw-m-0 tw-mb-6 tw-leading-6 {% if success %}tw-text-tt-notice{% else %}tw-text-tt-danger{% endif %}">{{ message }}</p>
    <a class="tw-inline-flex tw-min-h-[44px] tw-items-center tw-justify-center tw-rounded-lg tw-bg-white tw-px-5 tw-font-bold tw-text-black tw-no-underline" href="{{ url_for('login') }}">Back to sign in</a>
</main>
</body>
</html>
