<!doctype html>
<html lang="en" class="tw-min-w-[320px] tw-bg-black tw-[color-scheme:dark]">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>Change email</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="tw-m-0 tw-grid tw-min-h-screen tw-place-items-center tw-bg-black tw-p-5 tw-font-sans tw-text-white">
<main class="tw-w-[min(520px,100%)] tw-rounded-2xl tw-border tw-border-solid tw-border-tt-border tw-bg-[#0b0b0b] tw-p-8">
    <h1 class="tw-m-0 tw-mb-2 tw-font-league tw-text-[48px] tw-font-normal">CHANGE EMAIL</h1>
    <p class="tw-m-0 tw-mb-2 tw-text-tt-muted">Signed in as {{ username }}.</p>
    <p class="tw-m-0 tw-mb-5 tw-text-tt-muted">Current email: <strong class="tw-text-white">{{ email }}</strong></p>
    {% if notice %}<div class="tw-mb-4 tw-border tw-border-solid tw-border-tt-noticeBorder tw-bg-tt-noticeBg tw-p-3 tw-text-sm tw-text-tt-notice">{{ notice }}</div>{% endif %}
    {% if error %}<div class="tw-mb-4 tw-border tw-border-solid tw-border-tt-dangerBorder tw-bg-tt-dangerBg tw-p-3 tw-text-sm tw-text-tt-danger">{{ error }}</div>{% endif %}
    {% if not mail_configured %}<p class="tw-text-sm tw-text-tt-muted">Email delivery is not configured on this environment yet.</p>{% endif %}
    <form method="post" action="{{ url_for('phase4_email_change_post') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="tw-mb-2 tw-block tw-text-sm" for="email">New email</label>
        <input class="tw-w-full tw-min-h-[48px] tw-rounded-lg tw-border tw-border-solid tw-border-[#2b2b2b] tw-bg-[#111] tw-px-3 tw-text-white" id="email" name="email" type="email" required autocomplete="email">
        <label class="tw-mb-2 tw-mt-4 tw-block tw-text-sm" for="current-password">Current password</label>
        <input class="tw-w-full tw-min-h-[48px] tw-rounded-lg tw-border tw-border-solid tw-border-[#2b2b2b] tw-bg-[#111] tw-px-3 tw-text-white" id="current-password" name="current_password" type="password" required autocomplete="current-password">
        <button class="tw-mt-5 tw-min-h-[48px] tw-w-full tw-rounded-lg tw-border-0 tw-bg-white tw-font-bold tw-text-black" type="submit">SEND CONFIRMATION</button>
    </form>
    <p class="tw-mb-0 tw-mt-5 tw-text-sm"><a class="tw-text-white" href="/app/settings/auth">Back to account settings</a></p>
</main>
</body>
</html>
