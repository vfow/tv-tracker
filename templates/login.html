<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>TV Tracker — Sign in</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon.svg') }}">
    <style>
        @font-face{font-family:"League Gothic";src:url("{{ url_for('static', filename='assets/league-gothic.regular.ttf') }}")}
        *{box-sizing:border-box}
        html{min-width:320px;background:#000;color-scheme:dark}
        body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));overflow-x:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
        main{width:min(420px,100%);border:1px solid #242424;background:#080808;padding:32px}
        h1{margin:0 0 8px;font-family:"League Gothic",sans-serif;font-size:64px;font-weight:400;letter-spacing:.5px;line-height:1}
        p{margin:0 0 26px;color:#888}
        label{display:block;margin:16px 0 7px;color:#bbb;font-size:13px;text-transform:uppercase;letter-spacing:1px}
        input{width:100%;min-height:46px;border:1px solid #2b2b2b;border-radius:0;background:#111;color:#fff;padding:13px 14px;font-size:16px;outline:none;box-shadow:none}
        input:focus{border-color:#777;box-shadow:none}
        button{width:100%;min-height:46px;margin-top:24px;border:1px solid #2b2b2b;border-radius:0;background:#111;color:#555;padding:13px;font-weight:700;cursor:not-allowed;transition:background .16s ease,border-color .16s ease,color .16s ease}
        button.is-ready{border-color:#fff;background:#fff;color:#000;cursor:pointer}
        button.is-ready:hover{background:#d8d8d8}
        button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
        .error{margin:0 0 16px;padding:10px 12px;border:1px solid #632626;background:#210d0d;color:#ffb8b8;font-size:14px}.notice{margin:0 0 16px;padding:10px 12px;border:1px solid #285c39;background:#0d2114;color:#b8ffd0;font-size:14px}
        @media (max-width:480px){
            body{place-items:center stretch}
            main{padding:24px 20px}
            h1{font-size:56px}
            p{margin-bottom:22px}
        }
    </style>
</head>
<body>
<main>
    <h1>TV TRACKER</h1>
    <p>Private access</p>
    {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login_post') }}" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus autocomplete="username">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <button id="sign-in-button" type="submit">SIGN IN</button>
    </form>
</main>
<script src="{{ url_for('static', filename='js/login.js', v='1.3.0-stable') }}"></script>
</body>
</html>
