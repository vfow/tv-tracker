name: Phase 3 Auth Vue Build

on:
  push:
    branches:
      - multi-user/phase3-auth-sessions
    paths:
      - .github/workflows/phase3-auth-vue-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: multi-user/phase3-auth-sessions
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --audit=false

      - name: Build Vue frontend
        run: npm run build:frontend

      - name: Commit generated Vue assets
        run: |
          if git diff --quiet -- static/vue; then
            echo "No generated Vue changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/vue
          git commit -m "build: refresh Phase 3 Vue assets"
          git push origin HEAD:multi-user/phase3-auth-sessions
