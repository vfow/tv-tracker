name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvtracker_test
          POSTGRES_USER: tvtracker_test
          POSTGRES_PASSWORD: tvtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtracker_test -d tvtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt --strict
      - run: npm ci --audit=false
      - name: Verify npm build dependency security
        run: npm audit --audit-level=high
      - name: Build and verify committed Tailwind CSS
        run: |
          npm run build:css
          git diff --exit-code -- static/css/tailwind.css
      - name: Build and verify committed Vue frontend
        run: |
          npm run build:frontend
          git diff --exit-code -- static/vue
      - name: Diagnose test_discover_stability.js
        continue-on-error: true
        run: node tests/test_discover_stability.js
      - name: Diagnose test_duplicate_show_merge.js
        continue-on-error: true
        run: node tests/test_duplicate_show_merge.js
      - name: Diagnose test_final_notifications.js
        continue-on-error: true
        run: node tests/test_final_notifications.js
      - name: Diagnose test_frontend_modernization_discover_state_bridge.js
