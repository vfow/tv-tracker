name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvtracker_test
          POSTGRES_USER: tvtracker_test
          POSTGRES_PASSWORD: tvtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtracker_test -d tvtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Diagnose legacy Search renderer cleanup
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('static/js/ui.js').read_text(encoding='utf-8')
          declarations = re.findall(r'(?m)^function\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(', text)
          search_names = [name for name in declarations if 'search' in name.lower()]

          def extract_function(name):
              match = re.search(rf'(?m)^function\s+{re.escape(name)}\s*\([^)]*\)\s*\{{', text)
              if not match:
                  return ''
              start = match.start()
              brace = text.find('{', match.start())
              depth = 0
              quote = None
              escaped = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('"', "'", '`'):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
                  i += 1
              raise RuntimeError(name)

          body = extract_function('renderSearchResults')
          calls = sorted(set(re.findall(r'\b([A-Za-z_$][A-Za-z0-9_$]*)\s*\(', body)))
          local_calls = [name for name in calls if name in declarations]
          lines = [
              'SEARCH_FUNCTIONS=' + ','.join(search_names),
              'RENDER_SEARCH_RESULTS_LOCAL_CALLS=' + ','.join(local_calls),
          ]
          for name in search_names:
              lines.append(f'REFCOUNT {name}={len(re.findall(rf"\\b{re.escape(name)}\\b", text))}')
          Path('/tmp/search-cleanup-diagnostic.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Upload Search cleanup diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search-cleanup-diagnostic
          path: /tmp/search-cleanup-diagnostic.txt
          if-no-files-found: error
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt --strict
      - run: npm ci --audit=false
      - name: Verify npm build dependency security
        run: npm audit --audit-level=high
      - name: Build and verify committed Tailwind CSS
        run: |
          npm run build:css
          git diff --exit-code -- static/css/tailwind.css
      - name: Run full regression suite
        env:
          TEST_DATABASE_URL: postgresql://tvtracker_test:tvtracker_test@127.0.0.1:5432/tvtracker_test
        run: python tests/run_all.py
      - name: Check repository diff hygiene
        run: git diff --check
