name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvtracker_test
          POSTGRES_USER: tvtracker_test
          POSTGRES_PASSWORD: tvtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtracker_test -d tvtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt --strict
      - run: npm ci --audit=false
      - name: Verify npm build dependency security
        run: npm audit --audit-level=high
      - name: Build and verify committed Tailwind CSS
        run: |
          npm run build:css
          git diff --exit-code -- static/css/tailwind.css
      - name: Build and verify committed Vue frontend
        run: |
          npm run build:frontend
          git diff --exit-code -- static/vue
      - name: Python G
        env: &testenv
          TEST_DATABASE_URL: postgresql://tvtracker_test:tvtracker_test@127.0.0.1:5432/tvtracker_test
        run: python -m unittest discover -s tests -p 'test_g*.py' -v
      - name: Python H
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_h*.py' -v
      - name: Python I
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_i*.py' -v
      - name: Python J
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_j*.py' -v
      - name: Python K
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_k*.py' -v
      - name: Python L
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_l*.py' -v
      - name: Python M
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_m*.py' -v
      - name: Python N
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_n*.py' -v
      - name: Python O
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_o*.py' -v
      - name: Python P
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_p*.py' -v
      - name: Python Q
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_q*.py' -v
      - name: Python R
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_r*.py' -v
      - name: Python S
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_s*.py' -v
      - name: Python T
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_t*.py' -v
      - name: Python U-Z
        if: always()
        env: *testenv
        run: python -m unittest discover -s tests -p 'test_[u-zU-Z]*.py' -v
      - name: Check repository diff hygiene
        if: always()
        run: git diff --check
