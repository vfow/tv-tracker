name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvtracker_test
          POSTGRES_USER: tvtracker_test
          POSTGRES_PASSWORD: tvtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtracker_test -d tvtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt --strict
      - run: npm ci --audit=false
      - name: Verify npm build dependency security
        run: npm audit --audit-level=high
      - name: Build and verify committed Tailwind CSS
        run: |
          npm run build:css
          git diff --exit-code -- static/css/tailwind.css
      - name: Build and verify committed Vue frontend
        run: |
          npm run build:frontend
          git diff --exit-code -- static/vue
      - name: Source Search route ownership
        run: python -m unittest tests.test_source_contracts.TMDBOnlyContractTests.test_real_protected_page_routes_exist -v
      - name: Source Search routing polish
        if: always()
        run: python -m unittest tests.test_source_contracts.TMDBOnlyContractTests.test_phase51_search_routing_polish_exists -v
      - name: Source Search collection ownership
        if: always()
        run: python -m unittest tests.test_source_contracts.TMDBOnlyContractTests.test_phase_66j_adult_badge_and_collection_search_exist -v
      - name: Source Search view more ownership
        if: always()
        run: python -m unittest tests.test_source_contracts.TMDBOnlyContractTests.test_discover_description_and_view_more_polish_exists -v
      - name: Source movie Search ownership
        if: always()
        run: python -m unittest tests.test_source_contracts.TMDBOnlyContractTests.test_phase601_movie_layout_search_state_and_person_roles_exist -v
      - name: Check repository diff hygiene
        if: always()
        run: git diff --check
