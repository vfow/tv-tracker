name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: modernization/search-dead-renderer-cleanup-main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --audit=false
      - name: Regenerate committed Tailwind artifact
        run: npm run build:css
      - name: Commit regenerated Tailwind artifact when changed
        run: |
          if git diff --quiet -- static/css/tailwind.css; then
            echo "Tailwind artifact already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/tailwind.css
          git commit -m "Regenerate Tailwind after Search ownership cleanup"
          git push origin HEAD:modernization/search-dead-renderer-cleanup-main
