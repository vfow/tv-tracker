name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Temporary Phase 13 bootstrap permission. This is removed as soon as the
# frontend lockfile and compiled compatibility bundle are committed.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --audit=false
      - name: Bootstrap Phase 13 frontend lock and bundle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -eu
          npm install --prefix frontend --package-lock-only --ignore-scripts
          npm --prefix frontend ci --audit=false
          npm --prefix frontend run build
          git add frontend/package-lock.json static/modern
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock and compile Phase 13 frontend [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - run: npm --prefix frontend ci --audit=false
      - name: Verify production npm dependency security
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high
      - name: Build and verify committed modern frontend
        run: |
          npm run frontend:build
          git diff --exit-code -- static/modern
      - name: Run full regression suite
        run: python tests/run_all.py
      - name: Check repository diff hygiene
        run: git diff --check
