        run: node tests/test_frontend_modernization_discover_state_bridge.js
      - name: Diagnose test_frontend_modernization_discover_vue_renderer.js
        continue-on-error: true
        run: node tests/test_frontend_modernization_discover_vue_renderer.js
      - name: Diagnose test_frontend_modernization_episode_tracking_completion.js
