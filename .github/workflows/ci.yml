name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvtracker_test
          POSTGRES_USER: tvtracker_test
          POSTGRES_PASSWORD: tvtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtracker_test -d tvtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - name: Apply final notification-settings preservation alignment
        if: github.event_name == 'pull_request' && github.head_ref == 'multi-user/phase2-database-foundation'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_phase13_foundations.py")
          source = path.read_text(encoding="utf-8")
          old = '''        owner_scoped_rows = set(preserved_queries) - {"admin", "schema_meta"}\n        for name in owner_scoped_rows:\n            self.assertEqual(\n                rows_after_adoption[name][:-1],\n                rows_before_adoption[name],\n            )\n            self.assertIsNone(rows_after_adoption[name][-1])\n        self.assertEqual(\n            rows_after_adoption["admin"],\n            rows_before_adoption["admin"],\n        )'''
          new = '''        owner_scoped_rows = set(preserved_queries) - {\n            "admin",\n            "schema_meta",\n            "notification_settings",\n        }\n        for name in owner_scoped_rows:\n            self.assertEqual(\n                rows_after_adoption[name][:-1],\n                rows_before_adoption[name],\n            )\n            self.assertIsNone(rows_after_adoption[name][-1])\n\n        notification_settings_before = rows_before_adoption["notification_settings"]\n        notification_settings_after = rows_after_adoption["notification_settings"]\n        self.assertEqual(\n            notification_settings_after[:12],\n            notification_settings_before[:12],\n        )\n        self.assertGreaterEqual(\n            notification_settings_after[12],\n            notification_settings_before[12],\n        )\n        self.assertEqual(\n            notification_settings_after[13:15],\n            rows_before_adoption["final_settings"][1:3],\n        )\n        self.assertIsNone(notification_settings_after[-1])\n\n        self.assertEqual(\n            rows_after_adoption["admin"],\n            rows_before_adoption["admin"],\n        )'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("notification-settings preservation expectation was not in the expected shape")
          path.write_text(source, encoding="utf-8")
          PY
          if git diff --quiet -- tests/test_phase13_foundations.py; then
            echo "Notification-settings preservation alignment already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/test_phase13_foundations.py
            git commit -m "test: preserve v6 notification migration semantics"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt --strict
      - run: npm ci --audit=false
      - name: Verify npm build dependency security
        run: npm audit --audit-level=high
      - name: Build and verify committed Tailwind CSS
        run: |
          npm run build:css
          git diff --exit-code -- static/css/tailwind.css
      - name: Build and verify committed Vue frontend
        run: |
          npm run build:frontend
          git diff --exit-code -- static/vue
      - name: Run full regression suite
        env:
          TEST_DATABASE_URL: postgresql://tvtracker_test:tvtracker_test@127.0.0.1:5432/tvtracker_test
        run: python tests/run_all.py
      - name: Check repository diff hygiene
        run: git diff --check
