name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvtracker_test
          POSTGRES_USER: tvtracker_test
          POSTGRES_PASSWORD: tvtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtracker_test -d tvtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt --strict
      - run: npm ci --audit=false
      - name: Verify npm build dependency security
        run: npm audit --audit-level=high
      - name: Build and verify committed Tailwind CSS
        run: |
          npm run build:css
          git diff --exit-code -- static/css/tailwind.css

      - name: DIAG Python regression suite
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql://tvtracker_test:tvtracker_test@127.0.0.1:5432/tvtracker_test
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: DIAG test_frontend.js
        continue-on-error: true
        run: node tests/test_frontend.js
      - name: DIAG Search Discover contract
        continue-on-error: true
        run: node tests/test_frontend_modernization_search_discover_contract.js
      - name: DIAG Search state bridge
        continue-on-error: true
        run: node tests/test_frontend_modernization_search_state_bridge.js
      - name: DIAG Search Vue renderer
        continue-on-error: true
        run: node tests/test_frontend_modernization_search_vue_renderer.js
      - name: DIAG frontend ownership
        continue-on-error: true
        run: node tests/test_phase17_frontend_ownership.js
      - name: DIAG Search navigation
        continue-on-error: true
        run: node tests/test_search_navigation_fix.js
      - name: DIAG Discover stability
        continue-on-error: true
        run: node tests/test_discover_stability.js
      - name: DIAG adult policy
        continue-on-error: true
        run: node tests/test_phase4_adult_policy.js

      - name: DIAG remaining JS regressions
        continue-on-error: true
        shell: bash
        run: |
          set -e
          for test_file in tests/test_*.js; do
            case "$test_file" in
              tests/test_frontend.js|tests/test_frontend_modernization_search_discover_contract.js|tests/test_frontend_modernization_search_state_bridge.js|tests/test_frontend_modernization_search_vue_renderer.js|tests/test_phase17_frontend_ownership.js|tests/test_search_navigation_fix.js|tests/test_discover_stability.js|tests/test_phase4_adult_policy.js)
                continue
                ;;
            esac
            echo "RUNNING $test_file"
            node "$test_file"
          done

      - name: DIAG keep branch blocked
        if: always()
        run: exit 1
