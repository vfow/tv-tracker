name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      # The npm tree is build-only (Tailwind/DaisyUI). Audit production/runtime deps separately.
      - run: npm ci --audit=false
      - name: Verify production npm dependency security
        run: npm audit --omit=dev --audit-level=high
      - run: python tests/run_all.py
