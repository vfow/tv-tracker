name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvtracker_test
          POSTGRES_USER: tvtracker_test
          POSTGRES_PASSWORD: tvtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtracker_test -d tvtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --audit=false
      - name: Verify npm build dependency security
        run: npm audit --audit-level=high
      - name: Build and verify committed Tailwind CSS
        run: |
          npm run build:css
          git diff --exit-code -- static/css/tailwind.css
      - name: Run full regression suite
        env:
          TEST_DATABASE_URL: postgresql://tvtracker_test:tvtracker_test@127.0.0.1:5432/tvtracker_test
        run: python tests/run_all.py
      - name: Check repository diff hygiene
        run: git diff --check
