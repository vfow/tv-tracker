name: TV Tracker CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvtracker_test
          POSTGRES_USER: tvtracker_test
          POSTGRES_PASSWORD: tvtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtracker_test -d tvtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply Phase 2 migration contract fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'multi-user/phase2-database-foundation'
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path("tvtracker/migrations/registry_v7.py")
          source = registry.read_text(encoding="utf-8")
          old = """           constraint_row.convalidated
                         AND NOT constraint_row.condeferrable
                         AND NOT constraint_row.condeferred
                         AND NOT constraint_row.connoinherit AS healthy"""
          new = """           constraint_row.convalidated
                         AND NOT constraint_row.condeferrable
                         AND NOT constraint_row.condeferred
                         AND (
                             constraint_row.contype <> 'c'
                             OR NOT constraint_row.connoinherit
                         ) AS healthy"""
          if old in source:
              source = source.replace(old, new, 1)
              registry.write_text(source, encoding="utf-8")
          elif new not in source:
              raise SystemExit("registry_v7 constraint-health predicate was not in the expected shape")

          tests = Path("tests/test_phase13_foundations.py")
          source = tests.read_text(encoding="utf-8")

          old = '''                "0006_notification_settings_consolidation",\n            ],'''
          new = '''                "0006_notification_settings_consolidation",\n                "0007_multi_user_database_foundation",\n            ],'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("migration-id expectation was not in the expected shape")

          old = '''            MIGRATIONS[-1].schema_contract.legacy_schema_versions,\n            (4, 5),'''
          new = '''            MIGRATIONS[-1].schema_contract.legacy_schema_versions,\n            (4, 5, 6),'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("legacy-schema expectation was not in the expected shape")

          old = '''                "tv_tracker_shows",\n                "tv_tracker_state",\n            },\n        )\n        self.assertEqual(\n            ledger,'''
          new = '''                "tv_tracker_shows",\n                "tv_tracker_state",\n                "tv_tracker_users",\n            },\n        )\n        self.assertEqual(\n            ledger,'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("fresh-schema table expectation was not in the expected shape")

          marker = '''            (6, None),\n        )\n\n    def test_nulls_not_distinct_index_is_not_certified'''
          replacement = '''            (7, None),\n        )\n\n    def test_nulls_not_distinct_index_is_not_certified'''
          if marker in source:
              source = source.replace(marker, replacement, 1)
          elif replacement not in source:
              raise SystemExit("NULLS NOT DISTINCT schema-version expectation was not in the expected shape")

          tests.write_text(source, encoding="utf-8")
          PY
          if git diff --quiet -- tvtracker/migrations/registry_v7.py tests/test_phase13_foundations.py; then
            echo "Phase 2 fixes already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tvtracker/migrations/registry_v7.py tests/test_phase13_foundations.py
            git commit -m "fix: align Phase 2 schema validation"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt --strict
      - run: npm ci --audit=false
      - name: Verify npm build dependency security
        run: npm audit --audit-level=high
      - name: Build and verify committed Tailwind CSS
        run: |
          npm run build:css
          git diff --exit-code -- static/css/tailwind.css
      - name: Build and verify committed Vue frontend
        run: |
          npm run build:frontend
          git diff --exit-code -- static/vue
      - name: Run full regression suite
        env:
          TEST_DATABASE_URL: postgresql://tvtracker_test:tvtracker_test@127.0.0.1:5432/tvtracker_test
        run: python tests/run_all.py
      - name: Check repository diff hygiene
        run: git diff --check
