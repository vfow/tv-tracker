name: Phase 13 Frontend Bootstrap

on:
  push:
    branches: [architecture-futureproof-2026-08-18]
    paths:
      - '.github/workflows/phase13-frontend-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: architecture-futureproof-2026-08-18
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate lock and modern bundle
        run: |
          npm install --prefix frontend --package-lock-only --ignore-scripts
          npm --prefix frontend ci --audit=false
          npm --prefix frontend run build
      - name: Commit generated Phase 13 assets
        run: |
          git add frontend/package-lock.json static/modern
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock and compile Phase 13 frontend [skip ci]"
          git push origin HEAD:architecture-futureproof-2026-08-18
