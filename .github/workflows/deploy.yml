name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python tests/run_all.py

      - name: Pull latest code on Alwaysdata
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ssh-broghgf7.alwaysdata.net
          username: broghgf7
          key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          script: |
            cd ~/www/tv-tracker
            git pull --ff-only origin main

      - name: Verify live health endpoint
        run: |
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 https://broghgf7.alwaysdata.net/healthz | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 5
          done
          curl -fsS --max-time 10 https://broghgf7.alwaysdata.net/healthz
          exit 1
