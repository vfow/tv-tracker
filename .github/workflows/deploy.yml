name: Deploy TV Tracker

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --audit=false
      - run: npm --prefix frontend ci --audit=false
      - name: Verify production npm dependency security
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high
      - name: Build and verify committed modern frontend
        run: |
          npm run frontend:build
          git diff --exit-code -- static/modern
      - run: python tests/run_all.py
      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          username: ${{ secrets.ALWAYSDATA_SSH_USER }}
          key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          script: |
            set -eu
            cd "${{ secrets.ALWAYSDATA_APP_DIR }}"
            git pull --ff-only origin main
            if [ -x ".venv/bin/python" ]; then
              PYTHON_BIN=".venv/bin/python"
              PIP_SCOPE=""
            elif [ -x "venv/bin/python" ]; then
              PYTHON_BIN="venv/bin/python"
              PIP_SCOPE=""
            elif [ -x "env/bin/python" ]; then
              PYTHON_BIN="env/bin/python"
              PIP_SCOPE=""
            else
              PYTHON_BIN="python"
              PIP_SCOPE="--user"
            fi
            "$PYTHON_BIN" -m pip install $PIP_SCOPE -r requirements.txt
            "$PYTHON_BIN" -c "import pywebpush"
            "$PYTHON_BIN" -m tvtracker.migrations
      - name: Restart AlwaysData site
        env:
          ALWAYSDATA_API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
          ALWAYSDATA_ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
          ALWAYSDATA_SITE_ID: ${{ secrets.ALWAYSDATA_SITE_ID }}
        run: |
          set -eu
          test -n "$ALWAYSDATA_API_KEY"
          test -n "$ALWAYSDATA_ACCOUNT"
          test -n "$ALWAYSDATA_SITE_ID"
          curl --fail --silent --show-error \
            -X POST --basic \
            --user "${ALWAYSDATA_API_KEY} account=${ALWAYSDATA_ACCOUNT}:" \
            "https://api.alwaysdata.com/v1/site/${ALWAYSDATA_SITE_ID}/restart/"
      - name: Verify public health endpoint
        env:
          ALWAYSDATA_HEALTH_URL: ${{ secrets.ALWAYSDATA_HEALTH_URL }}
          HEALTHZ_SECRET: ${{ secrets.HEALTHZ_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            -H "X-Healthcheck-Token: ${HEALTHZ_SECRET}" \
            "${ALWAYSDATA_HEALTH_URL%/}/healthz"
