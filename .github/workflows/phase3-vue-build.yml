name: Phase 3 Vue Build

on:
  push:
    branches:
      - frontend-modernization-phase3-settings

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --audit=false
      - run: npm audit --audit-level=high
      - run: npm run build:frontend
      - name: Commit deterministic Vue assets
        run: |
          set -eu
          git add -A static/vue
          if git diff --cached --quiet; then
            echo "Vue assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build Vue Settings canary"
          git push origin HEAD:frontend-modernization-phase3-settings
