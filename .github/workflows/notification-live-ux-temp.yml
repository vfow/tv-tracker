name: Notification live UX temporary

on:
  push:
    branches:
      - feature/notification-live-ux

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/notification-live-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch notification live UX
        run: python tools/patch_notification_live_ux_temp.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Build Tailwind
        run: npm run css:build
      - name: Validate notification live UX
        run: |
          git diff --check
          node --check static/js/notifications.js
          python -m py_compile app.py notification_engine.py notifications_backend.py notification_worker.py tests/test_notifications.py tests/test_notification_backend_unit.py tests/test_notification_contract.py
          python -m unittest tests.test_notifications tests.test_notification_backend_unit
          python tests/test_notification_contract.py
          node tests/test_router.js
          node tests/test_nav_font_delivery.js
          node tests/test_frontend.js
          python -m unittest tests.test_cache_headers tests.test_route_contracts
          grep -q 'notification-live-toast-stack' static/css/tailwind.css
          grep -q 'notification-swipe-delete-reveal' static/css/tailwind.css
          grep -q 'rgba(120,0,40,.45)' static/css/tailwind.css
      - name: Commit notification live UX
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py notifications_backend.py static/js/notifications.js static/css/tailwind-input.css static/css/tailwind.css tests/test_notification_contract.py tests/test_notification_backend_unit.py
          git commit -m "Add live notification toasts and swipe delete polish"
          git push origin HEAD:feature/notification-live-ux
