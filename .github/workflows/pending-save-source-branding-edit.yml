name: Pending-save source branding edit

on:
  push:
    branches:
      - fix/pending-save-source-branding

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pending-save-source-branding
      - name: Apply exact product-neutral source cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          db_path = Path('static/js/db.js')
          db = db_path.read_text(encoding='utf-8')
          branded = 'Could not reach the TV Tracker server. Check your connection.'
          neutral = 'Could not reach the server. Check your connection.'
          if db.count(branded) != 1:
              raise SystemExit(f'Expected exactly one branded db.js fallback, found {db.count(branded)}')
          db_path.write_text(db.replace(branded, neutral, 1), encoding='utf-8')

          startup_path = Path('static/js/startup.js')
          startup = startup_path.read_text(encoding='utf-8')
          wrapper = '''    function installNeutralRequestErrorCopy(){\n        if(typeof global.friendlyRequestError !== "function"){\n            return;\n        }\n        const originalFriendlyRequestError = global.friendlyRequestError;\n        global.friendlyRequestError = function(error,fallback){\n            if(error instanceof TypeError){\n                return "Could not reach the server. Check your connection.";\n            }\n            return originalFriendlyRequestError(error,fallback);\n        };\n    }\n\n'''
          if startup.count(wrapper) != 1 or startup.count('    installNeutralRequestErrorCopy();\n') != 1:
              raise SystemExit('Expected startup neutral-copy wrapper shape not found')
          startup = startup.replace(wrapper, '', 1)
          startup = startup.replace('    installNeutralRequestErrorCopy();\n', '', 1)
          startup_path.write_text(startup, encoding='utf-8')

          test_path = Path('tests/test_pending_save_ux_contract.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              '    assert \'return "Could not reach the server. Check your connection.";\' in startup\n',
              '    assert "installNeutralRequestErrorCopy" not in startup\n'
              '    assert \'return "Could not reach the server. Check your connection.";\' in db\n'
          )
          marker = '    for notice in forbidden_notices:\n        assert notice not in runtime\n\n'
          if marker not in test:
              raise SystemExit('Expected pending-save forbidden notice contract not found')
          test = test.replace(
              marker,
              marker + '    assert "TV Tracker" not in runtime\n\n',
              1,
          )
          test_path.write_text(test, encoding='utf-8')

          helper = Path('.github/workflows/pending-save-source-branding-edit.yml')
          helper.unlink()
          PY
          git diff --check
          grep -Fq 'Could not reach the server. Check your connection.' static/js/db.js
          ! grep -Fq 'Could not reach the TV Tracker server. Check your connection.' static/js/db.js
          ! grep -Fq 'installNeutralRequestErrorCopy' static/js/startup.js
      - name: Commit cleanup and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/db.js static/js/startup.js tests/test_pending_save_ux_contract.py .github/workflows/pending-save-source-branding-edit.yml
          git commit -m "Remove pending-save runtime product branding"
          git push origin HEAD:fix/pending-save-source-branding
