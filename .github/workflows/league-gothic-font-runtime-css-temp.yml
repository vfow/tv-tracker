name: League Gothic focused runtime CSS temporary

on:
  push:
    branches:
      - fix/league-gothic-font-warnings

permissions:
  contents: write

jobs:
  restore-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/league-gothic-font-warnings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install font validation tooling
        run: python -m pip install fonttools brotli
      - name: Restore compiled CSS and patch only League Gothic
        run: |
          git fetch origin main
          git show origin/main:static/css/tailwind.css > static/css/tailwind.css
          python - <<'PY'
          from pathlib import Path
          import hashlib

          font = Path('static/assets/league-gothic.regular.woff2')
          version = hashlib.sha256(font.read_bytes()).hexdigest()[:12]
          css_path = Path('static/css/tailwind.css')
          css = css_path.read_text()
          old = 'src:url(../assets/league-gothic.regular.ttf) format("truetype")'
          new = f'src:url(../assets/league-gothic.regular.woff2?v={version}) format("woff2")'
          if css.count(old) != 1:
              raise SystemExit(f'Expected exactly one compiled League Gothic TTF source, found {css.count(old)}')
          css_path.write_text(css.replace(old, new, 1))
          print('Runtime League Gothic version:', version)
          PY
      - name: Ensure compiled CSS change is focused
        run: |
          python - <<'PY'
          import subprocess
          diff = subprocess.check_output(
              ['git','diff','--numstat','origin/main','--','static/css/tailwind.css'],
              text=True,
          ).strip()
          print('Compiled CSS numstat:', diff)
          parts = diff.split()
          assert len(parts) >= 2 and parts[0] == '1' and parts[1] == '1', diff
          PY
      - name: Validate repaired glyph bounds
        run: |
          python - <<'PY'
          from fontTools.ttLib import TTFont
          font = TTFont('static/assets/league-gothic.regular.woff2', recalcBBoxes=False, recalcTimestamp=False)
          glyf = font['glyf']
          order = font.getGlyphOrder()
          names = [name for name in order if int(getattr(glyf[name], 'numberOfContours', 0)) != 0]
          before = {name: tuple(getattr(glyf[name], k, None) for k in ('xMin','yMin','xMax','yMax')) for name in names}
          for name in names:
              glyf[name].recalcBounds(glyf)
          after = {name: tuple(getattr(glyf[name], k, None) for k in ('xMin','yMin','xMax','yMax')) for name in names}
          bad = [name for name in names if before[name] != after[name]]
          assert not bad, bad
          print(f'Validated {len(names)} non-empty League Gothic glyphs.')
          PY
      - run: node tests/test_nav_font_delivery.js
      - name: Install app requirements
        run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_cache_headers
      - name: Commit focused compiled CSS
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/css/tailwind.css
          git commit -m "Keep League Gothic runtime CSS patch focused"
          git push origin HEAD:fix/league-gothic-font-warnings
