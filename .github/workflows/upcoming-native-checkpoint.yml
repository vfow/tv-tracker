name: Upcoming native checkpoint

on:
  push:
    branches:
      - modernization/upcoming-vue-native-composition

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: modernization/upcoming-vue-native-composition
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Remove legacy Upcoming live DOM composers
        run: |
          python - <<'PY'
          from pathlib import Path

          def remove_function(text, signature):
              start = text.index(signature)
              brace = text.index('{', start)
              depth = 0
              quote = None
              escape = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in "'\"`":
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(text) and text[end] in ' \t\r\n':
                                  end += 1
                              return text[:start] + text[end:]
                  i += 1
              raise RuntimeError('unterminated ' + signature)

          ui_path = Path('static/js/ui.js')
          ui = ui_path.read_text(encoding='utf-8')
          for signature in (
              'async function renderUpcoming(startBackgroundRefresh=true)',
              'function renderUpcomingBatchEpisodesHTML(show,episodes)',
          ):
              if signature not in ui:
                  raise SystemExit('missing expected legacy function: ' + signature)
              ui = remove_function(ui, signature)
          ui_path.write_text(ui, encoding='utf-8')

          router_path = Path('static/js/app-router.js')
          router = router_path.read_text(encoding='utf-8')
          old = '''            if(list){\n                if(activeShowsTab === "upcoming" && typeof renderUpcomingSkeletonHTML === "function"){\n                    list.innerHTML = renderUpcomingSkeletonHTML();\n                }else if(activeShowsTab === "history" && typeof renderHistorySkeletonHTML === "function"){\n                    list.innerHTML = renderHistorySkeletonHTML();\n                }else{\n                    list.innerHTML = "";\n                }\n            }'''
          new = '''            if(list){\n                if(activeShowsTab === "history" && typeof renderHistorySkeletonHTML === "function"){\n                    list.innerHTML = renderHistorySkeletonHTML();\n                }else if(activeShowsTab !== "upcoming"){\n                    list.innerHTML = "";\n                }\n            }'''
          if old not in router:
              raise SystemExit('expected Upcoming router skeleton block not found')
          router_path.write_text(router.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm ci --audit=false
      - name: Check Upcoming Vue-native contract
        run: node tests/test_frontend_modernization_upcoming_notifications_vue_renderer.js
      - name: Build Vue frontend
        run: npm run build:frontend
      - name: Recheck Upcoming Vue-native contract
        run: node tests/test_frontend_modernization_upcoming_notifications_vue_renderer.js
      - name: Remove temporary checkpoint workflows
        run: |
          git rm -f .github/workflows/upcoming-source-inspect.yml
          git rm -f .github/workflows/upcoming-native-checkpoint.yml
      - name: Commit Upcoming native composition checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Upcoming Vue-native composition"
          git push origin HEAD:modernization/upcoming-vue-native-composition
