name: TVmaze audit repair

on:
  push:
    branches:
      - agent/tvmaze-full-rollout

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tvmaze-full-rollout
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Apply audited fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected patch target missing in {path}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1. Fix the notification runtime crash that the previous suite missed.
          replace_once(
              'notification_engine.py',
              '    local_today = now.astimezone(notification_zone(timezone_name)).date()\n    last_episode = normalize_episode(details.get("last_episode_to_air"))\n',
              '    local_today = now.astimezone(notification_zone(timezone_name)).date()\n    yesterday = local_today - timedelta(days=1)\n    last_episode = normalize_episode(details.get("last_episode_to_air"))\n',
          )

          # 2. Add context-specific provider gates while preserving resolver test hooks.
          replace_once(
              'release_timing.py',
              '''def env_flag(name: str, *, default: bool = False) -> bool:\n    value = os.environ.get(name)\n    if value is None:\n        return default\n    return value.strip().lower() in {"1", "true", "yes", "on"}\n''',
              '''def env_flag(name: str, *, default: bool = False) -> bool:\n    value = os.environ.get(name)\n    if value is None:\n        return default\n    return value.strip().lower() in {"1", "true", "yes", "on"}\n\n\ndef provider_flags() -> dict[str, bool]:\n    """Return the centralized, master-gated TVmaze rollout capabilities."""\n    master_enabled = env_flag("TVMAZE_ENABLED")\n    return {\n        "master_enabled": master_enabled,\n        "shadow_enabled": master_enabled and env_flag("TVMAZE_SHADOW_ENABLED"),\n        "upcoming_enabled": master_enabled and env_flag("TVMAZE_UPCOMING_ENABLED"),\n        "notifications_enabled": master_enabled and env_flag("TVMAZE_NOTIFICATIONS_ENABLED"),\n    }\n''',
          )
          replace_once(
              'release_timing.py',
              '''        provider: ReleaseTimingProvider | None = None,\n        provider_enabled: bool | None = None,\n        exact_enabled: bool | None = None,\n        date_only_enabled: bool | None = None,\n    ) -> None:\n        self.provider_enabled = env_flag("TVMAZE_ENABLED") if provider_enabled is None else bool(provider_enabled)\n        self.exact_enabled = env_flag("TVMAZE_EXACT_ENABLED") if exact_enabled is None else bool(exact_enabled)\n        self.date_only_enabled = env_flag("TVMAZE_DATE_ONLY_ENABLED") if date_only_enabled is None else bool(date_only_enabled)\n''',
              '''        provider: ReleaseTimingProvider | None = None,\n        provider_enabled: bool | None = None,\n        query_enabled: bool | None = None,\n        exact_enabled: bool | None = None,\n        date_only_enabled: bool | None = None,\n    ) -> None:\n        self.provider_enabled = env_flag("TVMAZE_ENABLED") if provider_enabled is None else bool(provider_enabled)\n        self.query_enabled = True if query_enabled is None else bool(query_enabled)\n        self.exact_enabled = env_flag("TVMAZE_EXACT_ENABLED") if exact_enabled is None else bool(exact_enabled)\n        self.date_only_enabled = env_flag("TVMAZE_DATE_ONLY_ENABLED") if date_only_enabled is None else bool(date_only_enabled)\n''',
          )
          replace_once(
              'release_timing.py',
              '        if not self.provider_enabled:\n            return None\n',
              '        if not self.provider_enabled or not self.query_enabled:\n            return None\n',
          )
          old_capability = '''def provider_capability() -> dict[str, Any]:\n    enabled = env_flag("TVMAZE_ENABLED")\n    available = False\n    if enabled:\n        try:\n            module = importlib.import_module("tvmaze_integration")\n            available = callable(getattr(module, "get_default_provider", None))\n        except (ImportError, OSError, RuntimeError):\n            available = False\n    return {\n        "enabled": enabled,\n        "available": available,\n        "exactAuthority": enabled and available and env_flag("TVMAZE_EXACT_ENABLED"),\n        "dateOnlyAuthority": enabled and available and env_flag("TVMAZE_DATE_ONLY_ENABLED"),\n    }\n'''
          new_capability = '''def provider_capability() -> dict[str, Any]:\n    flags = provider_flags()\n    available = False\n    should_load = any((\n        flags["shadow_enabled"],\n        flags["upcoming_enabled"],\n        flags["notifications_enabled"],\n    ))\n    if should_load:\n        try:\n            module = importlib.import_module("tvmaze_integration")\n            available = callable(getattr(module, "get_default_provider", None))\n        except (ImportError, OSError, RuntimeError):\n            available = False\n    return {\n        "enabled": flags["master_enabled"],\n        "available": available,\n        "shadowEnabled": flags["shadow_enabled"],\n        "upcomingAuthority": available and flags["upcoming_enabled"],\n        "notificationsAuthority": available and flags["notifications_enabled"],\n        # Preserve the existing frontend capability keys; they now describe\n        # Upcoming/loggability authority rather than global provider authority.\n        "exactAuthority": available and flags["upcoming_enabled"],\n        "dateOnlyAuthority": available and flags["upcoming_enabled"],\n    }\n'''
          replace_once('release_timing.py', old_capability, new_capability)

          # 3. Do not import/configure TVmaze at boot unless the master and a child capability are active.
          replace_once(
              'release_timing_routes.py',
              'from release_timing import ReleaseTimingResolver, provider_capability, valid_timezone\n',
              'from release_timing import ReleaseTimingResolver, provider_capability, provider_flags, valid_timezone\n',
          )
          replace_once(
              'release_timing_routes.py',
              '''    try:\n        from tvmaze_integration import configure_default_provider\n        configure_default_provider(connection_factory=connection_factory, tmdb_fetcher=tmdb_fetcher)\n    except (ImportError, OSError, RuntimeError):\n        # Optional integration must never prevent TV Tracker from booting.\n        pass\n''',
              '''    flags = provider_flags()\n    if flags["master_enabled"] and any((\n        flags["shadow_enabled"],\n        flags["upcoming_enabled"],\n        flags["notifications_enabled"],\n    )):\n        try:\n            from tvmaze_integration import configure_default_provider\n            configure_default_provider(connection_factory=connection_factory, tmdb_fetcher=tmdb_fetcher)\n        except (ImportError, OSError, RuntimeError):\n            # Optional integration must never prevent TV Tracker from booting.\n            pass\n''',
          )
          replace_once(
              'release_timing_routes.py',
              '        resolver = ReleaseTimingResolver()\n',
              '''        flags = provider_flags()\n        resolver = ReleaseTimingResolver(\n            provider_enabled=flags["master_enabled"],\n            query_enabled=flags["shadow_enabled"] or flags["upcoming_enabled"],\n            exact_enabled=flags["upcoming_enabled"],\n            date_only_enabled=flags["upcoming_enabled"],\n        )\n''',
          )

          # 4. Notifications receive their own authority switch and can shadow independently.
          replace_once(
              'notifications_backend.py',
              'from release_timing import ReleaseTimingResolver, parse_aware_datetime\n',
              'from release_timing import ReleaseTimingResolver, parse_aware_datetime, provider_flags\n',
          )
          replace_once(
              'notifications_backend.py',
              '    timing_resolver = ReleaseTimingResolver()\n',
              '''    flags = provider_flags()\n    timing_resolver = ReleaseTimingResolver(\n        provider_enabled=flags["master_enabled"],\n        query_enabled=flags["shadow_enabled"] or flags["notifications_enabled"],\n        exact_enabled=flags["notifications_enabled"],\n        date_only_enabled=flags["notifications_enabled"],\n    )\n''',
          )

          # 5. Re-check TMDB external IDs without creating one TMDB request per episode.
          replace_once(
              'tvmaze_integration.py',
              'REQUEST_TIMEOUT_SECONDS = 4.0\n',
              'REQUEST_TIMEOUT_SECONDS = 4.0\nEXTERNAL_ID_RECHECK_SECONDS = 900.0\n',
          )
          replace_once(
              'tvmaze_integration.py',
              '        self._recent_requests: dict[str, tuple[float, dict[str, Any] | None, Exception | None]] = {}\n',
              '        self._recent_requests: dict[str, tuple[float, dict[str, Any] | None, Exception | None]] = {}\n        self._external_id_cache: dict[int, tuple[float, str, int | None]] = {}\n',
          )
          replace_once(
              'tvmaze_integration.py',
              '''    def _cached_mapping(self, tmdb_id: int) -> tuple[int | None, str] | None:\n        self.ensure_provider_schema()\n        with self.connection_factory() as connection:\n            with connection.cursor() as cursor:\n                cursor.execute(\n                    "SELECT tvmaze_id, status, reason FROM tv_tracker_tvmaze_mapping "\n                    "WHERE tmdb_id = %s AND validator_version = %s AND expires_at > NOW()",\n                    (int(tmdb_id), VALIDATOR_VERSION),\n                )\n                row = cursor.fetchone()\n        if not row:\n            return None\n        self.diagnostics["cache_hits"] += 1\n        return (int(row[0]) if row[0] else None, str(row[2] or row[1] or ""))\n''',
              '''    def _tmdb_external_ids(self, tmdb_id: int) -> tuple[str, int | None]:\n        now = time.monotonic()\n        cached = self._external_id_cache.get(int(tmdb_id))\n        if cached and now - cached[0] <= EXTERNAL_ID_RECHECK_SECONDS:\n            return cached[1], cached[2]\n        external = self.tmdb_fetcher(f"tv/{int(tmdb_id)}/external_ids", None)\n        imdb_id = str(external.get("imdb_id") or "").strip()\n        raw_tvdb = external.get("tvdb_id")\n        try:\n            tvdb_id = int(raw_tvdb) if raw_tvdb else None\n        except (TypeError, ValueError):\n            tvdb_id = None\n        self._external_id_cache[int(tmdb_id)] = (now, imdb_id, tvdb_id)\n        return imdb_id, tvdb_id\n\n    def _cached_mapping(\n        self,\n        tmdb_id: int,\n        imdb_id: str,\n        tvdb_id: int | None,\n    ) -> tuple[int | None, str] | None:\n        self.ensure_provider_schema()\n        with self.connection_factory() as connection:\n            with connection.cursor() as cursor:\n                cursor.execute(\n                    "SELECT tvmaze_id, status, reason, imdb_id, tvdb_id FROM tv_tracker_tvmaze_mapping "\n                    "WHERE tmdb_id = %s AND validator_version = %s AND expires_at > NOW()",\n                    (int(tmdb_id), VALIDATOR_VERSION),\n                )\n                row = cursor.fetchone()\n        if not row:\n            return None\n        stored_imdb = str(row[3] or "").strip()\n        try:\n            stored_tvdb = int(row[4]) if row[4] else None\n        except (TypeError, ValueError):\n            stored_tvdb = None\n        if stored_imdb != str(imdb_id or "").strip() or stored_tvdb != tvdb_id:\n            return None\n        self.diagnostics["cache_hits"] += 1\n        return (int(row[0]) if row[0] else None, str(row[2] or row[1] or ""))\n''',
          )
          replace_once(
              'tvmaze_integration.py',
              '''    def _mapping(self, tmdb_id: int) -> tuple[int | None, str]:\n        cached = self._cached_mapping(tmdb_id)\n        if cached is not None:\n            return cached\n        external = self.tmdb_fetcher(f"tv/{int(tmdb_id)}/external_ids", None)\n        imdb_id = str(external.get("imdb_id") or "").strip()\n        raw_tvdb = external.get("tvdb_id")\n        try:\n            tvdb_id = int(raw_tvdb) if raw_tvdb else None\n        except (TypeError, ValueError):\n            tvdb_id = None\n        tvmaze_id, reason = self._lookup_external(imdb_id=imdb_id, tvdb_id=tvdb_id)\n''',
              '''    def _mapping(self, tmdb_id: int) -> tuple[int | None, str]:\n        imdb_id, tvdb_id = self._tmdb_external_ids(tmdb_id)\n        cached = self._cached_mapping(tmdb_id, imdb_id, tvdb_id)\n        if cached is not None:\n            return cached\n        tvmaze_id, reason = self._lookup_external(imdb_id=imdb_id, tvdb_id=tvdb_id)\n''',
          )

          # 6. Regression tests for the exact failures found in the manual audit.
          replace_once(
              'tests/test_notifications.py',
              '''from notification_engine import (\n    collect_metadata_notification_candidates,\n    collect_time_notification_candidates,\n)\n''',
              '''from notification_engine import (\n    collect_metadata_notification_candidates,\n    collect_time_notification_candidates,\n    season_detail_requests_for_today,\n)\n''',
          )
          replace_once(
              'tests/test_notifications.py',
              '''class NotificationRuleTests(unittest.TestCase):\n    zone = ZoneInfo("Asia/Kuala_Lumpur")\n\n''',
              '''class NotificationRuleTests(unittest.TestCase):\n    zone = ZoneInfo("Asia/Kuala_Lumpur")\n\n    def test_watching_show_requests_yesterdays_season_detail_without_crashing(self):\n        details = {\n            "last_episode_to_air": {\n                "season_number": 2,\n                "episode_number": 4,\n                "air_date": "2026-08-16",\n            }\n        }\n        now = datetime(2026, 8, 17, 10, 0, tzinfo=self.zone)\n        self.assertEqual(\n            season_detail_requests_for_today(details, now, "Asia/Kuala_Lumpur", "watching"),\n            {2},\n        )\n        self.assertEqual(\n            season_detail_requests_for_today(details, now, "Asia/Kuala_Lumpur", "paused"),\n            set(),\n        )\n\n''',
          )

          replace_once(
              'tests/test_release_timing.py',
              '''    def test_provider_exception_falls_back(self):\n''',
              '''    def test_query_gate_prevents_provider_call(self):\n        provider = StubProvider({"precision":"exact","release_at":"2026-08-16T00:00:00Z","release_date":"2026-08-16","trusted":True})\n        resolver = ReleaseTimingResolver(\n            provider=provider, provider_enabled=True, query_enabled=False, exact_enabled=True\n        )\n        result = resolver.resolve(\n            tmdb_id=1, season_number=1, episode_number=1,\n            tmdb_air_date="2026-08-16", timezone_name="UTC",\n        )\n        self.assertEqual(provider.calls, 0)\n        self.assertFalse(result.provider_used)\n\n    def test_master_disabled_capability_does_not_import_provider(self):\n        with mock.patch.dict(release_timing.os.environ, {\n            "TVMAZE_ENABLED": "false",\n            "TVMAZE_SHADOW_ENABLED": "true",\n            "TVMAZE_UPCOMING_ENABLED": "true",\n            "TVMAZE_NOTIFICATIONS_ENABLED": "true",\n        }, clear=False):\n            with mock.patch.object(release_timing.importlib, "import_module") as importer:\n                capability = release_timing.provider_capability()\n        importer.assert_not_called()\n        self.assertFalse(capability["enabled"])\n        self.assertFalse(capability["upcomingAuthority"])\n        self.assertFalse(capability["notificationsAuthority"])\n\n    def test_child_capabilities_are_independent(self):\n        with mock.patch.dict(release_timing.os.environ, {\n            "TVMAZE_ENABLED": "true",\n            "TVMAZE_SHADOW_ENABLED": "false",\n            "TVMAZE_UPCOMING_ENABLED": "true",\n            "TVMAZE_NOTIFICATIONS_ENABLED": "false",\n        }, clear=False):\n            flags = release_timing.provider_flags()\n        self.assertTrue(flags["master_enabled"])\n        self.assertTrue(flags["upcoming_enabled"])\n        self.assertFalse(flags["notifications_enabled"])\n\n    def test_provider_exception_falls_back(self):\n''',
          )

          replace_once(
              'tests/test_tvmaze_integration.py',
              '''    def test_external_id_conflict_is_rejected(self):\n''',
              '''    def test_mapping_cache_is_checked_against_current_tmdb_external_ids(self):\n        tmdb_fetcher = mock.Mock(return_value={"imdb_id": "tt-new", "tvdb_id": 456})\n        provider = TVmazeProvider(\n            connection_factory=lambda: None,\n            tmdb_fetcher=tmdb_fetcher,\n            opener=lambda *args, **kwargs: FakeResponse({}),\n        )\n        provider._cached_mapping = mock.Mock(return_value=(77, "verified_external_id"))\n        provider._lookup_external = mock.Mock()\n        self.assertEqual(provider._mapping(123), (77, "verified_external_id"))\n        provider._cached_mapping.assert_called_once_with(123, "tt-new", 456)\n        provider._lookup_external.assert_not_called()\n\n    def test_external_id_fetch_is_bounded_per_show(self):\n        tmdb_fetcher = mock.Mock(return_value={"imdb_id": "tt1", "tvdb_id": 123})\n        provider = TVmazeProvider(\n            connection_factory=lambda: None,\n            tmdb_fetcher=tmdb_fetcher,\n            opener=lambda *args, **kwargs: FakeResponse({}),\n        )\n        self.assertEqual(provider._tmdb_external_ids(42), ("tt1", 123))\n        self.assertEqual(provider._tmdb_external_ids(42), ("tt1", 123))\n        self.assertEqual(tmdb_fetcher.call_count, 1)\n\n    def test_external_id_conflict_is_rejected(self):\n''',
          )

          replace_once(
              'tests/test_tvmaze_architecture.py',
              '''    def test_release_timing_is_loaded_before_app(self):\n''',
              '''    def test_master_and_context_kill_switches_are_centralized(self):\n        resolver = self.text("release_timing.py")\n        routes = self.text("release_timing_routes.py")\n        notifications = self.text("notifications_backend.py")\n        for flag in (\n            "TVMAZE_ENABLED",\n            "TVMAZE_SHADOW_ENABLED",\n            "TVMAZE_UPCOMING_ENABLED",\n            "TVMAZE_NOTIFICATIONS_ENABLED",\n        ):\n            self.assertIn(flag, resolver)\n        self.assertIn('if flags["master_enabled"] and any((', routes)\n        self.assertIn('query_enabled=flags["shadow_enabled"] or flags["upcoming_enabled"]', routes)\n        self.assertIn('query_enabled=flags["shadow_enabled"] or flags["notifications_enabled"]', notifications)\n\n    def test_release_timing_is_loaded_before_app(self):\n''',
          )

          # 7. Document the actual deployment switches and the external scheduler requirement.
          env_path = Path('.env.example')
          env_text = env_path.read_text(encoding='utf-8')
          if 'TVMAZE_ENABLED=' not in env_text:
              env_text = env_text.rstrip() + '''\n\n# Optional TVmaze release-timing enrichment. All switches default off.\nTVMAZE_ENABLED=false\nTVMAZE_SHADOW_ENABLED=false\nTVMAZE_UPCOMING_ENABLED=false\nTVMAZE_NOTIFICATIONS_ENABLED=false\n'''
              env_path.write_text(env_text, encoding='utf-8')

          Path('TVMAZE.md').write_text('''# TVmaze Release Timing\n\nTVmaze is optional enrichment. TMDB remains the canonical TV Tracker identity and the permanent fallback. TVmaze IDs, mappings, episode payloads, and timing caches are disposable provider data and are not part of App Backup or core tracker state.\n\n## Feature switches\n\nAll switches default to `false` and `TVMAZE_ENABLED` is the master gate.\n\n- `TVMAZE_ENABLED` — permits the optional provider boundary to exist at runtime. When false, TV Tracker does not import/configure `tvmaze_integration.py`.\n- `TVMAZE_SHADOW_ENABLED` — allows provider lookups/cache warming without granting visible timing authority.\n- `TVMAZE_UPCOMING_ENABLED` — allows trusted TVmaze candidates to affect Upcoming and episode loggability.\n- `TVMAZE_NOTIFICATIONS_ENABLED` — independently allows trusted TVmaze candidates to affect notification release boundaries.\n\nDisabling `TVMAZE_ENABLED`, or removing `tvmaze_integration.py`, must immediately return the application to TMDB-only timing without changing routes, tracker identity, watched state, or history.\n\n## Notification worker cadence\n\nExact release data can only produce timely alerts if `notification_worker.py` is scheduled frequently enough by the production host. Before enabling `TVMAZE_NOTIFICATIONS_ENABLED`, verify the external Alwaysdata scheduled job and its real cadence. A cadence of five minutes or less is recommended for near-release alerts. The repository cannot prove an external host schedule by itself, so this is a deployment acceptance check rather than a code assumption.\n\n## Rollout acceptance\n\nBefore merge or production enablement: run `python tests/run_all.py`, the targeted TVmaze/notification tests, and the provider-removal/destruction acceptance gate. Keep the master switch off until those checks pass on the final commit.\n''', encoding='utf-8')
          PY

      - name: Targeted regression tests
        run: |
          python -m unittest tests.test_release_timing tests.test_tvmaze_integration tests.test_notifications tests.test_tvmaze_destruction tests.test_tvmaze_architecture

      - name: Full regression suite
        run: python tests/run_all.py

      - name: Validate diff
        run: git diff --check

      - name: Commit repaired rollout
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notification_engine.py notifications_backend.py release_timing.py release_timing_routes.py tvmaze_integration.py tests/test_notifications.py tests/test_release_timing.py tests/test_tvmaze_integration.py tests/test_tvmaze_architecture.py .env.example TVMAZE.md
          git commit -m "Fix TVmaze rollout audit findings"
          git push origin HEAD:agent/tvmaze-full-rollout
