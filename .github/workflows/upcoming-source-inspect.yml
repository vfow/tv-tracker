name: Upcoming source inspection

on:
  push:
    branches:
      - modernization/upcoming-vue-native-composition

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: modernization/upcoming-vue-native-composition
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upcoming-source-snapshot
          path: |
            static/js/ui.js
            static/js/notifications-runtime.js
            static/js/upcoming-notifications-vue-bridge.js
            frontend/src/upcoming-notifications
            frontend/src/main.ts
            tests/test_frontend_modernization_upcoming_notifications_vue_renderer.js
            tests/test_frontend.js
            tests/test_notification_contract.py
          if-no-files-found: error
