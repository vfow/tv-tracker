name: Apply Search cleanup tests once

on:
  push:
    branches:
      - modernization/search-dead-renderer-cleanup-current

permissions:
  contents: write

jobs:
  apply-search-cleanup-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build exact historical ownership-test patch
        run: |
          git diff --binary \
            c70325d247ddc9d583a1bf78a73ce2b8fdc3f5da \
            5880db7c0ba7949d3f13516c56b71edb920fe342 \
            -- \
            tests/test_frontend.js \
            tests/test_frontend_modernization_search_discover_contract.js \
            tests/test_frontend_modernization_search_vue_renderer.js \
            tests/test_source_contracts.py > /tmp/tests.patch
          test -s /tmp/tests.patch

      - name: Three-way apply current ownership assertions
        run: |
          git apply --3way --index /tmp/tests.patch
          git diff --cached --check

      - name: Run targeted Search cleanup contracts
        run: |
          node tests/test_frontend.js
          node tests/test_frontend_modernization_search_discover_contract.js
          node tests/test_frontend_modernization_search_vue_renderer.js
          python -m pytest tests/test_source_contracts.py -q

      - name: Commit ownership regression updates
        run: |
          if git diff --cached --quiet; then
            echo 'No test diff produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Search ownership cleanup contracts'
          git push origin HEAD:modernization/search-dead-renderer-cleanup-current
