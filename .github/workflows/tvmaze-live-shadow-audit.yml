name: TVmaze live shadow audit

on:
  push:
    branches:
      - agent/tvmaze-full-rollout
    paths:
      - tools/tvmaze_live_shadow_audit.py
      - .github/workflows/tvmaze-live-shadow-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tvmaze-full-rollout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/tvmaze_live_shadow_audit.py
