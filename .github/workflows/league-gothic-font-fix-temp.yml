name: League Gothic font repair temporary

on:
  push:
    branches:
      - fix/league-gothic-font-warnings

permissions:
  contents: write

jobs:
  repair-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/league-gothic-font-warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install validation tooling
        run: |
          python -m pip install -r requirements.txt fonttools brotli
          npm ci
      - name: Repair League Gothic and build WOFF2
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from fontTools.ttLib import TTFont

          source = Path('static/assets/league-gothic.regular.ttf')
          repaired = Path('/tmp/league-gothic.repaired.ttf')
          output = Path('static/assets/league-gothic.regular.woff2')

          def bounds(glyph):
              return tuple(getattr(glyph, key, None) for key in ('xMin', 'yMin', 'xMax', 'yMax'))

          def bbox_mismatches(path):
              font = TTFont(path, recalcBBoxes=False, recalcTimestamp=False)
              glyf = font['glyf']
              order = font.getGlyphOrder()
              before = {name: bounds(glyf[name]) for name in order}
              for name in order:
                  glyf[name].recalcBounds(glyf)
              after = {name: bounds(glyf[name]) for name in order}
              mismatches = [
                  (index, name, before[name], after[name])
                  for index, name in enumerate(order)
                  if before[name] != after[name]
              ]
              font.close()
              return mismatches

          source_mismatches = bbox_mismatches(source)
          source_ids = {item[0] for item in source_mismatches}
          expected_firefox_ids = {34, 94, 96, 103, 113}
          print('Original bbox mismatches:', source_mismatches)
          assert expected_firefox_ids.issubset(source_ids), (
              f'Firefox warning glyphs were not all reproduced: {expected_firefox_ids - source_ids}'
          )

          original = TTFont(source, recalcBBoxes=True, recalcTimestamp=False)
          original_metrics = (
              original['head'].unitsPerEm,
              original['hhea'].ascent,
              original['hhea'].descent,
              original['maxp'].numGlyphs,
              original['OS/2'].usWeightClass,
              original['OS/2'].usWidthClass,
          )
          original_order = original.getGlyphOrder()
          original.save(repaired)
          original.close()

          repaired_mismatches = bbox_mismatches(repaired)
          assert not repaired_mismatches, f'Repaired TTF still has bbox mismatches: {repaired_mismatches}'

          webfont = TTFont(repaired, recalcBBoxes=False, recalcTimestamp=False)
          webfont.flavor = 'woff2'
          webfont.save(output)
          webfont.close()

          final = TTFont(output, recalcBBoxes=False, recalcTimestamp=False)
          final_metrics = (
              final['head'].unitsPerEm,
              final['hhea'].ascent,
              final['hhea'].descent,
              final['maxp'].numGlyphs,
              final['OS/2'].usWeightClass,
              final['OS/2'].usWidthClass,
          )
          assert final.getGlyphOrder() == original_order, 'Glyph order changed during WOFF2 conversion'
          assert final_metrics == original_metrics, 'Font metrics changed during WOFF2 conversion'
          final.close()

          final_mismatches = bbox_mismatches(output)
          assert not final_mismatches, f'WOFF2 still has bbox mismatches: {final_mismatches}'

          version = hashlib.sha256(output.read_bytes()).hexdigest()[:12]
          print('League Gothic WOFF2 version:', version)

          css_path = Path('static/css/tailwind-input.css')
          css = css_path.read_text()
          old_css = 'src:url("../assets/league-gothic.regular.ttf") format("truetype");'
          new_css = f'src:url("../assets/league-gothic.regular.woff2?v={version}") format("woff2");'
          if old_css not in css:
              raise SystemExit('Expected League Gothic TTF source rule was not found')
          css_path.write_text(css.replace(old_css, new_css, 1))

          template_path = Path('templates/index.html')
          template = template_path.read_text()
          old_preload = '<link rel="preload" href="{{ url_for(\'static\', filename=\'assets/league-gothic.regular.ttf\') }}" as="font" type="font/ttf" crossorigin>'
          new_preload = '<link rel="preload" href="{{ url_for(\'static\', filename=\'assets/league-gothic.regular.woff2\') }}" as="font" type="font/woff2" crossorigin>'
          if old_preload not in template:
              raise SystemExit('Expected League Gothic TTF preload was not found')
          template_path.write_text(template.replace(old_preload, new_preload, 1))

          test_path = Path('tests/test_nav_font_delivery.js')
          test = test_path.read_text()
          if 'const crypto = require("crypto");' not in test:
              test = test.replace(
                  'const assert = require("assert");\n',
                  'const assert = require("assert");\nconst crypto = require("crypto");\n',
                  1,
              )
          old_assert = 'assert.ok(html.includes("league-gothic.regular.ttf"),"League Gothic should remain preloaded");'
          new_assert = '''const leagueFontPath = path.join(root,"static","assets","league-gothic.regular.woff2");
          const leagueFontVersion = crypto.createHash("sha256")
              .update(fs.readFileSync(leagueFontPath))
              .digest("hex")
              .slice(0,12);
          const leagueFontCssUrl = `../assets/league-gothic.regular.woff2?v=${leagueFontVersion}`;

          assert.ok(
              html.includes("filename='assets/league-gothic.regular.woff2'") && html.includes('type="font/woff2"'),
              "League Gothic WOFF2 should remain preloaded with the matching MIME type"
          );
          assert.ok(
              sourceCss.includes(`src:url("${leagueFontCssUrl}") format("woff2")`),
              "League Gothic CSS source must use the same content version as the preload URL"
          );
          assert.ok(
              compiledCss.includes(`league-gothic.regular.woff2?v=${leagueFontVersion}`),
              "compiled Tailwind CSS must preserve the versioned League Gothic WOFF2 URL"
          );
          assert.ok(!html.includes("league-gothic.regular.ttf"),"the old TTF should not be preloaded");
          assert.ok(!sourceCss.includes("league-gothic.regular.ttf"),"the old TTF should not be referenced by source CSS");
          assert.ok(!compiledCss.includes("league-gothic.regular.ttf"),"the old TTF should not be referenced by compiled CSS");'''
          if old_assert not in test:
              raise SystemExit('Expected navigation font preload assertion was not found')
          test_path.write_text(test.replace(old_assert, new_assert, 1))
          PY
      - name: Rebuild Tailwind CSS
        run: npm run css:build
      - name: Validate repaired font bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont

          path = Path('static/assets/league-gothic.regular.woff2')
          font = TTFont(path, recalcBBoxes=False, recalcTimestamp=False)
          glyf = font['glyf']
          order = font.getGlyphOrder()
          before = {
              name: tuple(getattr(glyf[name], key, None) for key in ('xMin', 'yMin', 'xMax', 'yMax'))
              for name in order
          }
          for name in order:
              glyf[name].recalcBounds(glyf)
          after = {
              name: tuple(getattr(glyf[name], key, None) for key in ('xMin', 'yMin', 'xMax', 'yMax'))
              for name in order
          }
          mismatches = [index for index, name in enumerate(order) if before[name] != after[name]]
          assert not mismatches, f'Final WOFF2 glyph bounds are inconsistent: {mismatches}'
          print(f'Validated {len(order)} League Gothic glyphs with no bbox mismatches.')
          PY
      - run: node tests/test_nav_font_delivery.js
      - run: python -m unittest tests.test_cache_headers
      - name: Commit tested font fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/assets/league-gothic.regular.woff2 static/css/tailwind-input.css static/css/tailwind.css templates/index.html tests/test_nav_font_delivery.js
          git commit -m "Fix League Gothic font delivery warnings"
          git push origin HEAD:fix/league-gothic-font-warnings
