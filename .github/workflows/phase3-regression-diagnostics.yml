name: Phase 3 Regression Diagnostics

on:
  push:
    branches:
      - multi-user/phase3-auth-sessions
    paths:
      - .github/workflows/phase3-regression-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvtracker_test
          POSTGRES_USER: tvtracker_test
          POSTGRES_PASSWORD: tvtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvtracker_test -d tvtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: multi-user/phase3-auth-sessions
          fetch-depth: 0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - run: npm ci --audit=false
      - name: Capture full regression output
        env:
          TEST_DATABASE_URL: postgresql://tvtracker_test:tvtracker_test@127.0.0.1:5432/tvtracker_test
        run: |
          set +e
          python tests/run_all.py > phase3-regression.log 2>&1
          status=$?
          printf '\nPHASE3_REGRESSION_EXIT=%s\n' "$status" >> phase3-regression.log
          cat phase3-regression.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase3-regression.log
          git commit -m "ci: capture Phase 3 regression failure"
          git push origin HEAD:multi-user/phase3-auth-sessions
          exit "$status"
