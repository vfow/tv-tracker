name: Apply TVmaze rollout patches

on:
  push:
    branches:
      - agent/tvmaze-full-rollout
    paths:
      - tools/apply_tvmaze_rollout.py
      - .github/workflows/apply-tvmaze-rollout.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tvmaze-full-rollout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python tools/apply_tvmaze_rollout.py
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python tests/run_all.py
      - name: Commit applied patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py notifications_backend.py notification_engine.py templates/index.html static/js/app.js
          git commit -m "Wire canonical release timing into tracker" || exit 0
          git push origin HEAD:agent/tvmaze-full-rollout
