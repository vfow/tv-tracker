name: TV Tracker Architecture Migration

on:
  push:
    branches: [architecture-futureproof-2026-08-18]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[architecture-wave1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-futureproof-2026-08-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --audit=false
      - name: Apply architecture migration wave 1
        run: python tools/architecture_migrate_wave1.py
      - name: Run full regression suite
        run: python tests/run_all.py
      - name: Check whitespace errors
        run: git diff --check
      - name: Commit migration if clean
        run: |
          set -eu
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[architecture-wave1] Establish canonical package boundaries"
          git push origin HEAD:architecture-futureproof-2026-08-18
