name: Temporary Watchlist Source Extraction

on:
  push:
    branches:
      - modernization/watchlist-vue-native-composition

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: modernization/watchlist-vue-native-composition
          fetch-depth: 0
      - name: Extract current Watchlist functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('static/js/ui.js').read_text()

          def extract_function(name):
              match = re.search(r'function\s+' + re.escape(name) + r'\s*\(', source)
              if not match:
                  raise SystemExit(f'missing function: {name}')
              brace = source.find('{', match.end())
              if brace < 0:
                  raise SystemExit(f'missing body: {name}')
              depth = 0
              i = brace
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('\"', "'", '`'):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return source[match.start():i + 1]
                  i += 1
              raise SystemExit(f'unclosed function: {name}')

          names = [
              'getWatchlistPosterFallback',
              'getWatchlistActionConfig',
              'createWatchlistCard',
              'getWatchlistShowsForCurrentView',
              'renderWatchlist',
              'refreshWatchlistShows',
          ]
          out = []
          for name in names:
              out.append(f'===== {name} =====\n{extract_function(name)}\n')
          path = Path('.tmp/watchlist-functions.txt')
          path.parent.mkdir(exist_ok=True)
          path.write_text('\n'.join(out))
          PY
      - name: Commit extraction snapshot
        run: |
          git config user.name "tv-tracker-modernization"
          git config user.email "165537678+vfow@users.noreply.github.com"
          git add -f .tmp/watchlist-functions.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Temporary extract Watchlist composer sources"
          git push origin HEAD:modernization/watchlist-vue-native-composition
