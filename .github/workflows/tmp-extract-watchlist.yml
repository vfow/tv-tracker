name: Temporary Watchlist Native Composition

on:
  push:
    branches:
      - modernization/watchlist-vue-native-composition

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[watchlist-native-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: modernization/watchlist-vue-native-composition
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --audit=false
      - name: Apply Watchlist native composition patch
        run: |
          python .tmp/implement_watchlist_native.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tailwind.config.js')
          text = path.read_text()
          frontend = "    './frontend/**/*.{vue,ts}',\n"
          if frontend not in text:
              anchor = "    './static/js/**/*.js',\n"
              if anchor not in text:
                  raise SystemExit('Tailwind content anchor missing')
              text = text.replace(anchor, anchor + frontend, 1)
              path.write_text(text)
          PY
      - name: Build committed frontend assets
        run: |
          npm run build:frontend
          npm run css:build
      - name: Run targeted Watchlist contracts
        run: |
          node tests/test_frontend_modernization_tracker_lists_completion.js
          node tests/test_frontend_modernization_tracker_lists_vue_renderer.js
          node tests/test_frontend_modernization_tracker_lists_status_parity.js
          python tests/test_source_contracts.py
          git diff --check
      - name: Commit Watchlist implementation
        run: |
          git config user.name "tv-tracker-modernization"
          git config user.email "165537678+vfow@users.noreply.github.com"
          git add frontend static docs tests tailwind.config.js
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Replace Watchlist legacy HTML composition [watchlist-native-done]"
          git push origin HEAD:modernization/watchlist-vue-native-composition
