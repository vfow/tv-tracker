name: Sprint 2 Movie Details Legacy Cleanup

on:
  push:
    branches:
      - modernization/movie-details-legacy-composer-removal

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: modernization/movie-details-legacy-composer-removal
          fetch-depth: 0
      - name: Remove retired Movie Details HTML composers
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('static/js/ui.js')
          source = path.read_text(encoding='utf-8')

          retired = [
              'renderMovieCompanyLogosHTML',
              'renderMovieGenresHTML',
              'renderMovieThemesDetailsHTML',
              'renderMovieGenresTabHTML',
              'renderMovieExternalLinksHTML',
              'getMovieActiveTab',
              'renderMovieTabsHTML',
              'renderMovieTrackingButtonHTML',
              'renderMovieActionButtonsHTML',
              'getMovieCrewByJobs',
              'renderMovieCrewLinksHTML',
              'renderMovieDirectedByHTML',
              'renderMovieCountryDetailsHTML',
              'renderMovieLanguageDetailsHTML',
              'renderMovieReleaseSortControlHTML',
              'renderMovieReleaseEntryHTML',
              'renderMovieReleaseCountryRowHTML',
              'renderMovieReleaseDateEntryHTML',
              'renderMovieReleaseDateRowHTML',
              'renderMovieReleasesHTML',
              'renderMovieCastTabHTML',
              'renderMovieCrewTabHTML',
              'renderMovieDetailsTabHTML',
              'renderMovieMoreLikeThisHTML',
              'renderMovieInfoTabHTML',
              'renderMovieActiveTabContentHTML',
          ]

          def remove_function(text, name):
              marker = f'function {name}('
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one declaration, found {count}')
              start = text.index(marker)
              match = re.search(r'\nfunction [A-Za-z_$][A-Za-z0-9_$]*\(', text[start + len(marker):])
              if not match:
                  raise SystemExit(f'{name}: could not find next top-level function boundary')
              end = start + len(marker) + match.start() + 1
              return text[:start] + text[end:]

          for name in retired:
              source = remove_function(source, name)

          for name in retired:
              if f'function {name}(' in source:
                  raise SystemExit(f'{name}: declaration survived cleanup')

          preserved = [
              'getMovieCertification',
              'normalizeMovieThemeItems',
              'renderMovieProvidersHTML',
              'getMovieReleaseTypeLabel',
              'getMovieReleaseTypeOrder',
              'getMovieReleaseSortMode',
              'collectMovieReleaseRows',
              'sortMovieReleaseRows',
              'groupMovieReleasesByCountry',
              'groupMovieReleasesByDate',
              'normalizeCrewJobGroupLabel',
              'getCrewJobDisplayOrder',
              'flattenCrewEntries',
              'collectCrewJobGroups',
              'renderCrewJobGroupsHTML',
              'formatMovieReleaseDate',
              'getCountryFlag',
              'getCountryName',
              'getCountryLabel',
              'getCrewRouteRole',
          ]
          for name in preserved:
              if f'function {name}(' not in source:
                  raise SystemExit(f'{name}: required shared helper was removed')

          path.write_text(source, encoding='utf-8')
      - name: Commit generated cleanup
        run: |
          rm .github/workflows/sprint2-movie-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/ui.js .github/workflows/sprint2-movie-cleanup.yml
          git diff --cached --check
          git commit -m "Remove retired Movie Details HTML composers"
          git push origin HEAD:modernization/movie-details-legacy-composer-removal
