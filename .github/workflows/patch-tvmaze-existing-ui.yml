name: Patch TVmaze existing UI

on:
  push:
    branches:
      - agent/tvmaze-upcoming-existing-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tvmaze-upcoming-existing-ui
          fetch-depth: 0

      - name: Patch canonical timing consumers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("static/js/app.js")
          ui_path = Path("static/js/ui.js")
          app = app_path.read_text()
          ui = ui_path.read_text()

          old_caught_up = '''    const today = new Date();
              today.setHours(0,0,0,0);

              const airDate = makeLocalDate(
                  getEpisodeCalendarDateString(nextEp.air_date,nextEp)
              );

              if(!airDate){
                  return false;
              }

              airDate.setHours(0,0,0,0);

              return airDate > today;'''
          new_caught_up = '''    const releaseDate = makeEpisodeReleaseDate(
                  nextEp.air_date,
                  nextEp,
                  show
              );

              if(!releaseDate){
                  return false;
              }

              return releaseDate > new Date();'''
          if app.count(old_caught_up) != 1:
              raise SystemExit(f"isCaughtUp replacement count was {app.count(old_caught_up)}, expected 1")
          app = app.replace(old_caught_up, new_caught_up, 1)

          helper_pattern = re.compile(
              r'function getCountdownText\(airDateString,episodeInfo=null\)\{.*?function formatAirDate\(dateString,episodeInfo=null\)\{.*?\n\}\n\n\n\n\n\nfunction updateTrackedLabels',
              re.S,
          )
          helper_replacement = '''function getCountdownText(airDateString,episodeInfo=null,showInfo=null){

              const diffDays = getDayDiffFromToday(
                  airDateString,
                  episodeInfo,
                  showInfo
              );

              if(diffDays === null){
                  return "";
              }

              const days = -diffDays;

              if(days <= 0){
                  return "Airing today!";
              }

              if(days === 1){
                  return "1 day remaining";
              }

              return days + " days remaining";

          }





          function formatAirDate(dateString,episodeInfo=null,showInfo=null){

              const calendarDate = window.TVTrackerReleaseTiming && typeof window.TVTrackerReleaseTiming.calendarDate === "function"
              ? window.TVTrackerReleaseTiming.calendarDate(dateString,episodeInfo,showInfo)
              : getEpisodeCalendarDateString(dateString,episodeInfo);

              if(!calendarDate){
                  return "";
              }

              const date = makeLocalDate(calendarDate);

              if(!date){
                  return "";
              }

              const dateText = date.toLocaleDateString(undefined,{
                  year:"numeric",
                  month:"short",
                  day:"numeric"
              });
              const releaseTime = getEpisodeReleaseTimeText(
                  dateString,
                  episodeInfo,
                  showInfo
              );

              return releaseTime ? dateText + " • " + releaseTime : dateText;

          }





          function updateTrackedLabels'''
          app, helper_count = helper_pattern.subn(helper_replacement, app, count=1)
          if helper_count != 1:
              raise SystemExit(f"timing helper replacement count was {helper_count}, expected 1")

          old_refresh = '''            onRefresh:()=>{
                          if(activePage === "shows" && activeShowsTab === "upcoming"){ renderUpcoming(false); }
                      }'''
          new_refresh = '''            onRefresh:()=>{
                          if(activePage === "shows"){
                              if(activeShowsTab === "upcoming"){
                                  renderUpcoming(false);
                                  return;
                              }
                              if(activeShowsTab === "watchlist"){
                                  renderWatchlist();
                                  return;
                              }
                          }
                          if(activePage === "show-detail" && typeof renderActiveShowDetailPage === "function"){
                              renderActiveShowDetailPage();
                              return;
                          }
                          if(activePage === "episode-detail" && typeof renderActiveEpisodeDetailPage === "function"){
                              renderActiveEpisodeDetailPage();
                          }
                      }'''
          if app.count(old_refresh) != 1:
              raise SystemExit(f"release timing refresh callback count was {app.count(old_refresh)}, expected 1")
          app = app.replace(old_refresh, new_refresh, 1)

          ui_replacements = {
              'formatAirDate(nextEp.air_date,nextEp)': 'formatAirDate(nextEp.air_date,nextEp,show)',
              'getCountdownText(nextEp.air_date,nextEp)': 'getCountdownText(nextEp.air_date,nextEp,show)',
              'formatAirDate(ep.air_date,ep)': 'formatAirDate(ep.air_date,ep,show)',
              'formatAirDate(episodeData.air_date,episodeData)': 'formatAirDate(episodeData.air_date,episodeData,show)',
          }
          for old, new in ui_replacements.items():
              count = ui.count(old)
              if count < 1:
                  raise SystemExit(f"UI replacement not found: {old}")
              ui = ui.replace(old, new)

          app_path.write_text(app)
          ui_path.write_text(ui)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- static/js/app.js static/js/ui.js; then
            echo "No patch changes detected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/app.js static/js/ui.js
          git commit -m "Wire canonical timing into existing show UI"
          git push origin HEAD:agent/tvmaze-upcoming-existing-ui
