name: Notifications full regression temporary

on:
  push:
    branches:
      - feature/notifications-v1

permissions:
  contents: read

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/notifications-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Run Python regression suite excluding two stale main contracts
        run: |
          python - <<'PY'
          import unittest
          from pathlib import Path

          loader = unittest.TestLoader()
          suite = loader.discover('tests', pattern='test_*.py')
          stale = {
              'test_source_contracts.TMDBOnlyContractTests.test_deploy_workflow_tests_and_checks_healthz',
              'test_source_contracts.TMDBOnlyContractTests.test_phase61_movie_tracking_foundation_exists',
          }

          def filtered(test_suite):
              result = unittest.TestSuite()
              for test in test_suite:
                  if isinstance(test, unittest.TestSuite):
                      nested = filtered(test)
                      if nested.countTestCases():
                          result.addTest(nested)
                  elif test.id().split('tests.',1)[-1] not in stale:
                      result.addTest(test)
              return result

          selected = filtered(suite)
          print(f'Running {selected.countTestCases()} Python tests; skipped known stale main contracts: {sorted(stale)}')
          outcome = unittest.TextTestRunner(verbosity=2).run(selected)
          if not outcome.wasSuccessful():
              raise SystemExit(1)
          PY
          python tests/test_compact_sync_conflict.py
          python tests/test_notification_contract.py
      - name: Run repository JavaScript regression suite
        run: |
          node tests/test_frontend.js
          node tests/test_router.js
          node tests/test_phase_63c.js
          node tests/test_sync_reliability.js
          node tests/test_tmdb_cache.js
          node tests/test_show_removal_integrity.js
          node tests/test_duplicate_show_merge.js
          node tests/test_provider_freshness.js
          node tests/test_provider_save_batching.js
          node tests/test_streaming_region.js
          node tests/test_nav_font_delivery.js
      - name: Notification-specific syntax and source build
        run: |
          python -m py_compile app.py notification_engine.py notifications_backend.py notification_worker.py
          node --check static/js/notifications.js
          node --check static/js/app-router.js
          node --check static/js/ui.js
          cp static/css/tailwind.css /tmp/runtime.css
          npm run css:build
          cp /tmp/runtime.css static/css/tailwind.css
