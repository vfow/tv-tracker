name: Notification native header temporary

on:
  push:
    branches:
      - fix/notification-native-header

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-native-header
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch notification header
        run: python tools/patch_notification_native_header_temp.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Validate notification UI and rules
        run: |
          node --check static/js/notifications.js
          python -m py_compile notification_engine.py notifications_backend.py notification_worker.py tests/test_notifications.py tests/test_notification_contract.py
          python -m unittest tests.test_notifications
          python tests/test_notification_contract.py
          node tests/test_router.js
          node tests/test_nav_font_delivery.js
          python -m unittest tests.test_cache_headers tests.test_route_contracts
      - name: Validate Tailwind source
        run: |
          cp static/css/tailwind.css /tmp/notification-native-header.css
          npm run css:build
          grep -q 'notifications-back-button' static/css/tailwind.css
          grep -q 'League Gothic' static/css/tailwind.css
          cp /tmp/notification-native-header.css static/css/tailwind.css
      - name: Commit native notification header fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/js/notifications.js static/css/tailwind-input.css static/css/tailwind.css tests/test_notification_contract.py
          git commit -m "Reuse native notification header styles"
          git push origin HEAD:fix/notification-native-header
