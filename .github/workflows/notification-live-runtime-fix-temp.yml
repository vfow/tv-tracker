name: Notification live runtime CSS correction

on:
  push:
    branches:
      - feature/notification-live-ux

permissions:
  contents: write

jobs:
  fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/notification-live-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore preserved runtime CSS
        run: |
          git fetch origin main
          git checkout origin/main -- static/css/tailwind.css
          python tools/fix_notification_live_runtime_temp.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Validate Tailwind source without replacing runtime CSS
        run: |
          cp static/css/tailwind.css /tmp/notification-live-runtime.css
          npm run css:build
          grep -q 'notification-live-toast-stack' static/css/tailwind.css
          grep -q 'notification-swipe-delete-reveal' static/css/tailwind.css
          grep -q 'rgba(120,0,40,.45)' static/css/tailwind.css
          cp /tmp/notification-live-runtime.css static/css/tailwind.css
      - name: Validate notification UX after runtime restore
        run: |
          git diff --check
          node --check static/js/notifications.js
          python -m py_compile app.py notification_engine.py notifications_backend.py notification_worker.py tests/test_notifications.py tests/test_notification_backend_unit.py tests/test_notification_contract.py
          python -m unittest tests.test_notifications tests.test_notification_backend_unit
          python tests/test_notification_contract.py
          node tests/test_router.js
          node tests/test_nav_font_delivery.js
          node tests/test_frontend.js
          python -m unittest tests.test_cache_headers tests.test_route_contracts
          grep -q 'Notification live UX runtime overrides' static/css/tailwind.css
          grep -q 'notification-row-delete{z-index:2}' static/css/tailwind.css
      - name: Commit runtime-safe notification UX
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/css/tailwind-input.css static/css/tailwind.css tests/test_notification_contract.py
          git commit -m "Preserve runtime CSS for notification live UX"
          git push origin HEAD:feature/notification-live-ux
