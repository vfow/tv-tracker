name: Apply Search cleanup once

on:
  push:
    branches:
      - modernization/search-dead-renderer-cleanup-current

permissions:
  contents: write

jobs:
  apply-search-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build exact historical Search cleanup patch
        run: |
          git diff --binary \
            c70325d247ddc9d583a1bf78a73ce2b8fdc3f5da \
            5880db7c0ba7949d3f13516c56b71edb920fe342 \
            -- static/js/ui.js > /tmp/ui.patch
          test -s /tmp/ui.patch
          git apply --check /tmp/ui.patch || true

      - name: Three-way apply Search dead-renderer deletion
        run: |
          git apply --3way --index /tmp/ui.patch
          git diff --cached --check

      - name: Verify cleanup boundary
        run: |
          ! grep -q 'function renderTrackerPersonSkeletonCards' static/js/ui.js
          ! grep -q 'function renderSearchTabButtonHTML' static/js/ui.js
          ! grep -q 'function renderInactiveEyeFilterControlHTML' static/js/ui.js
          ! grep -q 'function renderSearchResultPosterCard' static/js/ui.js
          ! grep -q 'function renderSearchPersonCard' static/js/ui.js
          ! grep -q 'function renderSearchResults' static/js/ui.js
          grep -q 'function lockSearchRouteBeforeResultOpen' static/js/ui.js
          grep -q 'function getEyeFilteredRenderItems' static/js/ui.js
          grep -q 'function renderCollectionCard' static/js/ui.js
          grep -q 'function renderEyeFilterControlHTML' static/js/ui.js

      - name: Commit surgical cleanup
        run: |
          if git diff --cached --quiet; then
            echo 'No cleanup diff produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove dead legacy Search renderer ownership'
          git push origin HEAD:modernization/search-dead-renderer-cleanup-current
