name: Notifications patch runner temporary

on:
  push:
    branches:
      - feature/notifications-v1

permissions:
  contents: write

jobs:
  implement-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/notifications-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract and run integration patch
        run: |
          cp tests/test_notifications.py /tmp/test_notifications.py
          cp tests/test_notification_contract.py /tmp/test_notification_contract.py
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/notifications-implement-temp.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          ) + "\n"

          bad_start = "if chunk.count('if(renderedGroups === 0){') != 1:"
          bad_end = "ui = ui[:start] + chunk + ui[next_function:]"
          block_start = code.index(bad_start)
          block_end = code.index(bad_end, block_start)
          replacement = '''empty_refresh_anchor = '        if(startBackgroundRefresh){'\nif chunk.count(empty_refresh_anchor) < 1:\n    raise SystemExit('renderUpcoming: empty-state refresh marker missing')\nchunk = chunk.replace(\n    empty_refresh_anchor,\n    ''' + '"""' + '''        if(\n            window.TVTrackerNotifications &&\n            typeof window.TVTrackerNotifications.mountUpcomingBellFallback === "function"\n        ){\n            window.TVTrackerNotifications.mountUpcomingBellFallback(list);\n        }\n\n        if(startBackgroundRefresh){''' + '"""' + ''',\n    1,\n)\n'''
          code = code[:block_start] + replacement + code[block_end:]

          title_old = '''insertion += '\\n        notifications:"Notifications",\\n        "notification-settings":"Notification Settings"' '''.strip()
          title_new = '''insertion += '\\n        notifications:"Notifications",\\n        "notification-settings":"Notification Settings",' '''.strip()
          if title_old not in code:
              raise SystemExit('notification title-map patch marker missing')
          code = code.replace(title_old,title_new,1)

          Path('/tmp/notifications_patch.py').write_text(code)
          compile(code,'notifications_patch.py','exec')
          PY
          python /tmp/notifications_patch.py
          cp /tmp/test_notifications.py tests/test_notifications.py
          cp /tmp/test_notification_contract.py tests/test_notification_contract.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Validate source CSS build without accepting unrelated generated churn
        run: |
          cp static/css/tailwind.css /tmp/notifications-focused-tailwind.css
          npm run css:build
          cp /tmp/notifications-focused-tailwind.css static/css/tailwind.css
      - name: Syntax checks
        run: |
          python -m py_compile app.py notification_engine.py notifications_backend.py notification_worker.py tests/test_notifications.py tests/test_notification_contract.py
          node --check static/js/notifications.js
          node --check static/js/app-router.js
          node --check static/js/ui.js
      - name: Run Notifications V1 regression tests
        run: |
          python -m unittest tests.test_notifications
          python tests/test_notification_contract.py
          node tests/test_router.js
          node tests/test_nav_font_delivery.js
          python -m unittest tests.test_cache_headers tests.test_route_contracts
      - name: Check focused runtime CSS diff
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          diff = subprocess.check_output(
              ['git','diff','--numstat','origin/main','--','static/css/tailwind.css'],
              text=True,
          ).strip()
          print('Runtime CSS numstat:', diff)
          if diff:
              added, deleted, *_ = diff.split()
              assert added != '-' and deleted != '-'
              assert int(deleted) <= 5, diff
          PY
      - name: Commit integrated Notifications V1
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py templates/index.html static/js/notifications.js static/js/app-router.js static/js/ui.js static/css/tailwind-input.css static/css/tailwind.css tests/test_router.js tests/test_notifications.py tests/test_notification_contract.py
          git commit -m "Integrate Notifications V1"
          git push origin HEAD:feature/notifications-v1
