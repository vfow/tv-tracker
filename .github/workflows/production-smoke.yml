name: Production Smoke

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-tracker-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Verify live production
        env:
          ALWAYSDATA_HEALTH_URL: ${{ secrets.ALWAYSDATA_HEALTH_URL }}
          HEALTHZ_SECRET: ${{ secrets.HEALTHZ_SECRET }}
        run: |
          set -eu
          EXPECTED_RELEASE_SHA="$(git rev-parse HEAD)"
          export EXPECTED_RELEASE_SHA
          python tools/production_smoke.py
