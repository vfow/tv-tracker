name: Phase 4F Source Contract Fix

on:
  push:
    branches:
      - frontend-modernization-phase4f-settings-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: frontend-modernization-phase4f-settings-completion
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Update ownership-aware source contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_source_contracts.py')
          source = path.read_text(encoding='utf-8')

          source_anchor = "        settings = self.read('static/js/settings.js')\n        self.assertNotIn('Metadata ' + 'Source', settings)"
          source_replacement = "        settings = self.read('static/js/settings.js')\n        data_settings = self.read('frontend/src/settings/SettingsData.vue')\n        self.assertNotIn('Metadata ' + 'Source', settings)"
          if source_anchor not in source:
              raise SystemExit('source-section ownership anchor not found')
          source = source.replace(source_anchor, source_replacement, 1)

          old_report_assert = "        self.assertIn('Export, import, or create a readable report', settings)"
          old_simkl_assert = "        self.assertNotIn('Simkl / Trakt', settings)"
          if old_report_assert not in source or old_simkl_assert not in source:
              raise SystemExit('source-section presentation assertions not found')
          source = source.replace(old_report_assert, "        self.assertIn('Export, import, or create a readable report', data_settings)", 1)
          source = source.replace(old_simkl_assert, "        self.assertNotIn('Simkl / Trakt', data_settings)", 1)

          profile_anchor = "        settings = self.read('static/js/settings.js')\n        self.assertIn('profile-header-${preset}', settings)"
          profile_replacement = "        profile_settings = self.read('frontend/src/settings/SettingsProfile.vue')\n        self.assertIn('profile-header-${preset[0]}', profile_settings)"
          if profile_anchor not in source:
              raise SystemExit('profile-header ownership anchor not found')
          source = source.replace(profile_anchor, profile_replacement, 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Run source contracts
        run: python tests/test_source_contracts.py
      - name: Commit source contract fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_source_contracts.py
          git commit -m "Update Settings source ownership contracts"
          git push origin HEAD:frontend-modernization-phase4f-settings-completion
