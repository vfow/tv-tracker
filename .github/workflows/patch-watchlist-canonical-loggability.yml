name: Patch watchlist canonical loggability

on:
  push:
    branches:
      - agent/watchlist-canonical-loggability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/watchlist-canonical-loggability
          fetch-depth: 0
      - name: Apply canonical watchlist fix
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('static/js/app.js')
          ui_path = Path('static/js/ui.js')
          contract_path = Path('tests/test_release_timing_ui_contracts.py')
          runtime_test_path = Path('tests/test_watchlist_canonical_loggability.js')

          app = app_path.read_text(encoding='utf-8')
          ui = ui_path.read_text(encoding='utf-8')
          contracts = contract_path.read_text(encoding='utf-8')

          marker = '''function isUnknownDateEpisodeInReleasedSeason(showInfo,seasonNumber,episodeInfo=null){'''
          helper = '''function getEpisodeTimingInfo(episodeInfo=null,seasonNumber=null){
              if(!episodeInfo || typeof episodeInfo !== "object"){
                  return episodeInfo;
              }

              const season = Number(
                  episodeInfo.season_number !== undefined
                  ? episodeInfo.season_number
                  : episodeInfo.season !== undefined
                  ? episodeInfo.season
                  : seasonNumber
              );
              const episode = getEpisodeNumberFromInfo(episodeInfo);

              if(!Number.isFinite(season) || !Number.isFinite(episode)){
                  return episodeInfo;
              }

              if(
                  Number(episodeInfo.season_number) === season &&
                  Number(episodeInfo.episode_number) === episode
              ){
                  return episodeInfo;
              }

              return Object.assign({},episodeInfo,{
                  season_number:season,
                  episode_number:episode
              });
          }

          '''
          if 'function getEpisodeTimingInfo(' not in app:
              if marker not in app:
                  raise SystemExit('episode timing helper insertion marker missing')
              app = app.replace(marker, helper + marker, 1)

          old_loggable = '''function isEpisodeLoggable(episodeInfo=null,showInfo=null,seasonNumber=null){
              const airDate = episodeInfo && typeof episodeInfo === "object"
              ? episodeInfo.air_date
              : "";

              if(isEpisodeAired(airDate,episodeInfo,showInfo)){
                  return true;
              }

              if(airDate){
                  return false;
              }

              return isUnknownDateEpisodeInReleasedSeason(showInfo,seasonNumber,episodeInfo);
          }'''
          new_loggable = '''function isEpisodeLoggable(episodeInfo=null,showInfo=null,seasonNumber=null){
              const timingEpisode = getEpisodeTimingInfo(episodeInfo,seasonNumber);
              const airDate = timingEpisode && typeof timingEpisode === "object"
              ? timingEpisode.air_date
              : "";

              if(isEpisodeAired(airDate,timingEpisode,showInfo)){
                  return true;
              }

              if(airDate){
                  return false;
              }

              return isUnknownDateEpisodeInReleasedSeason(showInfo,seasonNumber,timingEpisode);
          }'''
          if old_loggable not in app:
              raise SystemExit('isEpisodeLoggable source did not match expected main state')
          app = app.replace(old_loggable,new_loggable,1)

          def replace_between(text,start_marker,end_marker,new_block,label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label} start marker missing')
              end = text.find(end_marker,start)
              if end < 0:
                  raise SystemExit(f'{label} end marker missing')
              return text[:start] + new_block.rstrip() + '\n\n\n\n' + text[end:]

          new_next_episode = '''function getNextEpisode(show){

              const watched = show.episodes_watched || {};
              const details = show._episode_details || {};
              const episodeLists = show._episode_list || {};

              const maxSeasons = Math.max(show.number_of_seasons || 1,1);

              for(let season = 1; season <= maxSeasons; season++){

                  const episodeList = episodeLists[String(season)];

                  if(!Array.isArray(episodeList) || episodeList.length === 0){

                      return {
                          season:season,
                          episode:1,
                          season_number:season,
                          episode_number:1,
                          name:"",
                          air_date:"",
                          needsLoad:true
                      };

                  }

                  for(let i = 0; i < episodeList.length; i++){

                      const ep = episodeList[i];

                      if(!isEpisodeLoggable(ep,show,season)){
                          continue;
                      }

                      const episodeNumber = ep.episode_number;

                      const watchedEpisodes = watched[String(season)] || [];

                      if(!watchedEpisodes.includes(episodeNumber)){

                          const detail = details[`${season}-${episodeNumber}`] || ep || {};

                          return {
                              season:season,
                              episode:episodeNumber,
                              season_number:season,
                              episode_number:episodeNumber,
                              name:detail.name || "",
                              air_date:detail.air_date || "",
                              air_time:detail.air_time || "",
                              air_timestamp:detail.air_timestamp || "",
                              needsLoad:false
                          };

                      }

                  }

              }

              return null;

          }'''
          app = replace_between(
              app,
              'function getNextEpisode(show){',
              'function getWatchedEpisodeCount(show){',
              new_next_episode,
              'getNextEpisode'
          )

          old_missed_check = '''            if(!isEpisodeAired(ep.air_date,ep,show)){
                          continue;
                      }'''
          missed_start = app.find('function getNextMissedAiredEpisode(show){')
          missed_end = app.find('function getNextFutureEpisode(show){',missed_start)
          if missed_start < 0 or missed_end < 0:
              raise SystemExit('getNextMissedAiredEpisode markers missing')
          missed_block = app[missed_start:missed_end]
          if old_missed_check not in missed_block:
              raise SystemExit('getNextMissedAiredEpisode aired check did not match')
          missed_block = missed_block.replace(
              old_missed_check,
              '''            if(!isEpisodeLoggable(ep,show,season)){
                          continue;
                      }''',
              1
          )
          app = app[:missed_start] + missed_block + app[missed_end:]

          old_action = '''        nextEp.air_date &&
                  isEpisodeAired(nextEp.air_date,nextEp,show)'''
          new_action = '''        nextEp.air_date &&
                  isEpisodeLoggable(nextEp,show,nextEp.season)'''
          if old_action not in ui:
              raise SystemExit('watchlist action availability check did not match')
          ui = ui.replace(old_action,new_action,1)

          old_can_log = '            const canLog = isEpisodeAired(ep.air_date,ep,show);'
          new_can_log = '            const canLog = isEpisodeLoggable(ep,show,ep.season_number);'
          if old_can_log not in ui:
              raise SystemExit('Upcoming canLog check did not match')
          ui = ui.replace(old_can_log,new_can_log,1)

          old_contract = '''        self.assertIn("const canonicalDayDifference = getDayDiffFromToday(ep.air_date,ep,show);", self.app)
                  self.assertIn("canonicalDayDifference !== null && canonicalDayDifference < 0", self.app)'''
          new_contract = '''        self.assertIn("if(!isEpisodeLoggable(ep,show,season))", self.app)
                  self.assertNotIn("const canonicalDayDifference = getDayDiffFromToday(ep.air_date,ep,show);", self.app)
                  self.assertIn("const canLog = isEpisodeLoggable(ep,show,ep.season_number);", self.ui)
                  self.assertIn("isEpisodeLoggable(nextEp,show,nextEp.season)", self.ui)'''
          if old_contract not in contracts:
              raise SystemExit('watching UI contract source did not match')
          contracts = contracts.replace(old_contract,new_contract,1)

          runtime_test = r'''const assert = require("assert");
          const fs = require("fs");
          const vm = require("vm");

          const app = fs.readFileSync("static/js/app.js","utf8");

          function section(startMarker,endMarker){
              const start = app.indexOf(startMarker);
              const end = app.indexOf(endMarker,start);
              assert(start >= 0, `missing ${startMarker}`);
              assert(end > start, `missing ${endMarker}`);
              return app.slice(start,end);
          }

          const source = [
              section("function getEpisodeNumberFromInfo", "function getHistoryEntries"),
              section("function filterShow(show){", "function getWatchedEpisodeCount(show){")
          ].join("\n");

          const availability = new Map();
          const seen = [];
          const context = {
              console,
              Object,
              Array,
              Number,
              String,
              Math,
              Date,
              activeFilter:"watching",
              getDayDiffFromToday(){ return 0; },
              isEpisodeAired(airDate,episodeInfo){
                  const season = Number(episodeInfo && episodeInfo.season_number);
                  const episode = Number(episodeInfo && episodeInfo.episode_number);
                  seen.push({season,episode,airDate});
                  if(!Number.isFinite(season) || !Number.isFinite(episode)){
                      return true; // reproduces the old TMDB date-only fallback path
                  }
                  return availability.get(`${season}:${episode}`) === true;
              }
          };
          vm.createContext(context);
          vm.runInContext(source,context);

          const futureShow = {
              status:"watching",
              number_of_seasons:1,
              episodes_watched:{},
              _episode_details:{},
              _episode_list:{
                  "1":[{episode_number:1,air_date:"2026-08-16",name:"Pilot"}]
              }
          };

          availability.set("1:1",false);
          seen.length = 0;
          assert.strictEqual(context.getNextEpisode(futureShow),null,"future canonical episode must not become the Watching next episode");
          assert.strictEqual(context.filterShow(futureShow),false,"show with only a future canonical episode must not appear in Watching");
          assert(seen.some(item=>item.season === 1 && item.episode === 1),"season hint must be restored before canonical timing is checked");

          availability.set("1:1",true);
          const aired = context.getNextEpisode(futureShow);
          assert(aired,"aired canonical episode must appear in Watching");
          assert.strictEqual(aired.season,1);
          assert.strictEqual(aired.episode,1);
          assert.strictEqual(aired.season_number,1,"returned next episode must preserve canonical season identity");
          assert.strictEqual(aired.episode_number,1,"returned next episode must preserve canonical episode identity");
          assert.strictEqual(context.filterShow(futureShow),true);

          futureShow.episodes_watched = {"1":[1]};
          assert.strictEqual(context.getNextEpisode(futureShow),null,"watched episodes must remain excluded");
          assert.strictEqual(context.filterShow(futureShow),false);

          console.log("Watchlist canonical loggability regression tests passed.");
          '''

          app_path.write_text(app,encoding='utf-8')
          ui_path.write_text(ui,encoding='utf-8')
          contract_path.write_text(contracts,encoding='utf-8')
          runtime_test_path.write_text(runtime_test,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/app.js static/js/ui.js tests/test_release_timing_ui_contracts.py tests/test_watchlist_canonical_loggability.js
          git commit -m "Unify Watching with canonical episode loggability"
          git push origin HEAD:agent/watchlist-canonical-loggability
