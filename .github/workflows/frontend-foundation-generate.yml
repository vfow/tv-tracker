name: Generate Vue foundation lock and assets

on:
  push:
    branches: [frontend-modernization-phase2-vue-foundation]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: frontend-modernization-phase2-vue-foundation
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Refresh deterministic npm lock
        run: npm install --package-lock-only --ignore-scripts --audit=false
      - name: Install and audit dependencies
        run: |
          npm ci --audit=false
          npm audit --audit-level=high
      - name: Build Vue foundation
        run: npm run build:frontend
      - name: Commit generated lock and assets
        run: |
          set -eu
          git add package-lock.json static/vue
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build Vue foundation assets'
          git push origin HEAD:frontend-modernization-phase2-vue-foundation
