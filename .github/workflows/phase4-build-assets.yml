name: Phase 4 Build Assets

on:
  push:
    branches: [multi-user/phase4-account-email-flows]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: multi-user/phase4-account-email-flows
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --audit=false
      - run: npm run build:css
      - run: npm run build:frontend
      - name: Commit generated assets
        run: |
          if git diff --quiet -- static/css/tailwind.css static/vue; then
            echo "Generated assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/tailwind.css static/vue
          git commit -m "Build Phase 4 frontend assets"
          git push origin HEAD:multi-user/phase4-account-email-flows
