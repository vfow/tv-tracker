name: Notifications inspection temporary

on:
  push:
    branches:
      - feature/notifications-v1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect router and app hooks
        shell: bash
        run: |
          set -eu
          echo '=== ROUTER APPLY CONTEXT ==='
          sed -n '500,1160p' static/js/app-router.js
          echo '=== APP BOTTOM ==='
          tail -n 120 app.py
          echo '=== APP INIT / DATA READY ==='
          grep -n -E 'initDatabase|getStoredData|appDataReady|startDataSync|prepareInitial|initialize|DOMContentLoaded' static/js/app.js static/js/db.js | tail -n 160 || true
      - name: Inspect CSS hooks
        shell: bash
        run: |
          set -eu
          echo '=== UPCOMING CSS ==='
          grep -n -E '^\.upcoming-group|upcoming-group-title|upcoming-entry-card|upcoming-time' static/css/tailwind-input.css | head -n 100 || true
          for pattern in 'upcoming-group-title' 'settings-inner' 'settings-section' 'settings-action-button'; do
            line=$(grep -n "$pattern" static/css/tailwind-input.css | head -1 | cut -d: -f1 || true)
            if [ -n "$line" ]; then start=$((line-30)); [ "$start" -lt 1 ] && start=1; end=$((line+100)); echo "=== CSS CONTEXT $pattern ==="; sed -n "${start},${end}p" static/css/tailwind-input.css; fi
          done
          echo '=== CSS COLORS / ROOT ==='
          sed -n '1,220p' static/css/tailwind-input.css
      - name: Inspect show metadata and tests
        shell: bash
        run: |
          set -eu
          echo '=== STATUS / HISTORY SHAPES ==='
          grep -n -E 'show\.status|status:|episodes_watched|_episode_list|_season_details|tmdb_status|number_of_seasons|last_episode_to_air|next_episode_to_air' static/js/app.js | head -n 320 || true
          echo '=== METADATA REFRESH CONTEXT ==='
          sed -n '6200,6340p' static/js/app.js
          echo '=== TEST FILES ==='
          find tests -maxdepth 1 -type f -printf '%f\n' | sort
          echo '=== PACKAGE ==='
          cat package.json
