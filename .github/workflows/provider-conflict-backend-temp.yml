name: Provider conflict backend temporary patch

on:
  push:
    branches:
      - fix/provider-sync-conflicts

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-sync-conflicts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch compact conflict response
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text()
          old = '''                if conflicting:
                    return jsonify({
                        "ok": False,
                        "error": "The same tracker data changed on another device",
                        "revision": revision_before,
                        "reset": False,
                        "conflict": True,
                        "changes": serialize_change_rows(concurrent_rows),
                    }), 409
          '''
          new = '''                if conflicting:
                    return jsonify({
                        "ok": False,
                        "error": "The same tracker data changed on another device",
                        "revision": revision_before,
                        "reset": True,
                        "conflict": True,
                    }), 409
          '''
          if old not in text:
              raise SystemExit('Expected conflict response block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Add conflict response regression
        run: |
          cat > tests/test_compact_sync_conflict.py <<'PY'
          from pathlib import Path

          source = Path('app.py').read_text()
          conflict = source.split('                if conflicting:', 1)[1].split(
              '                logical_history_delete:', 1
          )[0]

          assert '"reset": True' in conflict
          assert '"conflict": True' in conflict
          assert 'serialize_change_rows(concurrent_rows)' not in conflict
          print('Compact sync conflict regression test passed.')
          PY
      - run: python -m py_compile app.py
      - run: python tests/test_compact_sync_conflict.py
      - run: node --check static/js/provider-freshness.js
      - run: node tests/test_provider_freshness.js
      - run: node tests/test_provider_save_batching.js
      - run: node tests/test_streaming_region.js
      - name: Commit tested backend fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py tests/test_compact_sync_conflict.py
          git commit -m "Keep sync conflict responses compact"
          git push origin HEAD:fix/provider-sync-conflicts
