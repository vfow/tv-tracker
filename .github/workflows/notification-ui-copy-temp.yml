name: Notification UI copy temporary

on:
  push:
    branches:
      - fix/notification-ui-copy-and-back

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-ui-copy-and-back
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch notification UI
        run: python tools/patch_notification_ui_temp.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Validate notification behavior and UI contracts
        run: |
          node --check static/js/notifications.js
          python -m py_compile notification_engine.py notifications_backend.py notification_worker.py tests/test_notifications.py tests/test_notification_contract.py
          python -m unittest tests.test_notifications
          python tests/test_notification_contract.py
          node tests/test_router.js
          node tests/test_nav_font_delivery.js
          python -m unittest tests.test_cache_headers tests.test_route_contracts
      - name: Validate Tailwind source without accepting unrelated generated churn
        run: |
          cp static/css/tailwind.css /tmp/notification-ui-runtime.css
          npm run css:build
          cp /tmp/notification-ui-runtime.css static/css/tailwind.css
      - name: Commit UI polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/js/notifications.js static/css/tailwind-input.css static/css/tailwind.css tests/test_notification_contract.py
          git commit -m "Polish notification navigation and descriptions"
          git push origin HEAD:fix/notification-ui-copy-and-back
