name: Notification UI copy temporary

on:
  push:
    branches:
      - fix/notification-ui-copy-and-back

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-ui-copy-and-back
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch notification copy and navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          js_path = Path('static/js/notifications.js')
          js = js_path.read_text()

          old_options = '''    const SETTINGS_LABELS = [
              ["newSeason","New Season"],
              ["seasonPremiereTomorrow","Season Premiere Tomorrow"],
              ["newEpisode","New Episode"],
              ["returnsTomorrow","Returns Tomorrow"],
              ["canceledEnded","Canceled / Ended"],
              ["premiereDateUpdates","Premiere Date Updates"]
          ];'''
          new_options = '''    const SETTINGS_OPTIONS = [
              ["newSeason","New Season","When a new season is added to a show."],
              ["seasonPremiereTomorrow","Season Premiere Tomorrow","When a show's new season begins tomorrow."],
              ["newEpisode","New Episode","When a new episode show becomes available."],
              ["returnsTomorrow","Returns Tomorrow","When a Watching show returns."],
              ["canceledEnded","Canceled / Ended","When a show is canceled or ended."],
              ["premiereDateUpdates","Premiere Date Updates","When a season premiere date is announced, changed, or delayed."]
          ];'''
          js = replace_once(js, old_options, new_options, 'settings options')

          old_notifications_header = '''                <header class="notifications-header">
                              <h1>Notifications</h1>
                              <a class="notifications-settings-link" href="/app/notifications/settings" aria-label="Notification settings">
                                  <img src="${SETTINGS_ICON}" alt="" aria-hidden="true" class="notification-icon notification-icon--light">
                              </a>
                          </header>'''
          new_notifications_header = '''                <header class="notifications-header">
                              <div class="notifications-heading">
                                  <div class="notifications-title-row">
                                      <a class="notifications-back-link" href="/app/upcoming" aria-label="Back to Upcoming"><span aria-hidden="true">←</span></a>
                                      <h1>Notifications</h1>
                                  </div>
                                  <p class="notifications-subtitle">Updates from the shows you follow.</p>
                              </div>
                              <a class="notifications-settings-link" href="/app/notifications/settings" aria-label="Notification settings">
                                  <img src="${SETTINGS_ICON}" alt="" aria-hidden="true" class="notification-icon notification-icon--light">
                              </a>
                          </header>'''
          js = replace_once(js, old_notifications_header, new_notifications_header, 'notifications header')

          old_switch = '''    function switchMarkup(key,label,checked,disabled=false){
                  return `
                      <label class="notification-setting-row" data-setting-row="${key}">
                          <span class="notification-setting-copy">
                              <strong>${label}</strong>
                          </span>
                          <span class="notification-switch">
                              <input type="checkbox" data-notification-setting="${key}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}>
                              <span class="notification-switch-track" aria-hidden="true"><span class="notification-switch-thumb"></span></span>
                          </span>
                      </label>
                  `;
              }'''
          new_switch = '''    function switchMarkup(key,label,checked,disabled=false,description=""){
                  return `
                      <label class="notification-setting-row" data-setting-row="${key}">
                          <span class="notification-setting-copy">
                              <strong>${label}</strong>
                              ${description ? '<span class="notification-setting-description">' + description + '</span>' : ""}
                          </span>
                          <span class="notification-switch">
                              <input type="checkbox" data-notification-setting="${key}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}>
                              <span class="notification-switch-track" aria-hidden="true"><span class="notification-switch-thumb"></span></span>
                          </span>
                      </label>
                  `;
              }'''
          js = replace_once(js, old_switch, new_switch, 'switch markup')

          old_family = '''            const familyRows = SETTINGS_LABELS.map(([key,label])=>{
                          return switchMarkup(key,label,settings[key] !== false,settings.enabled === false);
                      }).join("");'''
          new_family = '''            const familyRows = SETTINGS_OPTIONS.map(([key,label,description])=>{
                          return switchMarkup(key,label,settings[key] !== false,settings.enabled === false,description);
                      }).join("");'''
          js = replace_once(js, old_family, new_family, 'family rows')

          old_settings_header = '''                    <header class="notifications-header notification-settings-header">
                                  <h1>Notification Settings</h1>
                              </header>'''
          new_settings_header = '''                    <header class="notifications-header notification-settings-header">
                                  <div class="notifications-heading">
                                      <div class="notifications-title-row">
                                          <a class="notifications-back-link" href="/app/notifications" aria-label="Back to Notifications"><span aria-hidden="true">←</span></a>
                                          <h1>Notification Settings</h1>
                                      </div>
                                      <p class="notifications-subtitle">Choose which updates you want to receive.</p>
                                  </div>
                              </header>'''
          js = replace_once(js, old_settings_header, new_settings_header, 'settings header')
          js_path.write_text(js)

          css_old = '''.notifications-header{display:flex;min-height:54px;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;border-bottom:1px solid #1d1d1d}
          .notifications-header h1{margin:0;color:#fff;font-size:28px;font-weight:700;line-height:1.2}'''
          css_new = '''.notifications-header{display:flex;min-height:72px;align-items:center;justify-content:space-between;gap:16px;padding:10px 16px;border-bottom:1px solid #1d1d1d}
          .notifications-heading{min-width:0;flex:1 1 auto}
          .notifications-title-row{display:flex;min-width:0;align-items:center;gap:10px}
          .notifications-header h1{margin:0;color:#fff;font-size:28px;font-weight:700;line-height:1.2}
          .notifications-back-link{display:inline-flex;width:32px;height:32px;flex:0 0 32px;align-items:center;justify-content:center;border-radius:9999px;color:#ddd;text-decoration:none;transition:background-color .16s ease,color .16s ease}
          .notifications-back-link:hover{background:#1b1b1b;color:#fff}
          .notifications-back-link span{display:block;font-size:24px;line-height:1;transform:translateY(-1px)}
          .notifications-subtitle{margin:4px 0 0 42px;color:#777;font-size:13px;line-height:1.35}'''

          copy_old = '''.notification-setting-row{display:flex;min-height:68px;align-items:center;justify-content:space-between;gap:24px;padding:14px 16px;border-bottom:1px solid #1d1d1d;cursor:pointer;transition:background-color .16s ease,opacity .16s ease}
          .notification-setting-row:hover{background:#080808}
          .notification-setting-row--disabled{opacity:.45;cursor:default}
          .notification-setting-copy{min-width:0}
          .notification-setting-copy strong{color:#ddd;font-size:16px;font-weight:500}'''
          copy_new = '''.notification-setting-row{display:flex;min-height:76px;align-items:center;justify-content:space-between;gap:24px;padding:14px 16px;border-bottom:1px solid #1d1d1d;cursor:pointer;transition:background-color .16s ease,opacity .16s ease}
          .notification-setting-row:hover{background:#080808}
          .notification-setting-row--disabled{opacity:.45;cursor:default}
          .notification-setting-copy{display:flex;min-width:0;flex-direction:column;gap:4px}
          .notification-setting-copy strong{color:#ddd;font-size:16px;font-weight:500}
          .notification-setting-description{color:#777;font-size:13px;line-height:1.35}'''

          mobile_old = '''  .notifications-header{min-height:58px;padding:0 6px}
            .notifications-header h1{font-size:25px}'''
          mobile_new = '''  .notifications-header{min-height:68px;padding:8px 6px}
            .notifications-header h1{font-size:25px}
            .notifications-subtitle{font-size:12px}'''

          for css_name in ('static/css/tailwind-input.css','static/css/tailwind.css'):
              css_path = Path(css_name)
              css = css_path.read_text()
              css = replace_once(css, css_old, css_new, f'{css_name} header')
              css = replace_once(css, copy_old, copy_new, f'{css_name} setting copy')
              css = replace_once(css, mobile_old, mobile_new, f'{css_name} mobile')
              css_path.write_text(css)

          test_path = Path('tests/test_notification_contract.py')
          test = test_path.read_text()
          marker = '''assert "/* Notifications V1 */" in css
          '''
          addition = '''assert "/* Notifications V1 */" in css

          expected_notification_copy = (
              "When a new season is added to a show.",
              "When a show's new season begins tomorrow.",
              "When a new episode show becomes available.",
              "When a Watching show returns.",
              "When a show is canceled or ended.",
              "When a season premiere date is announced, changed, or delayed.",
          )
          for copy in expected_notification_copy:
              assert copy in frontend

          assert 'href="/app/upcoming" aria-label="Back to Upcoming"' in frontend
          assert 'href="/app/notifications" aria-label="Back to Notifications"' in frontend
          assert "Updates from the shows you follow." in frontend
          assert "Choose which updates you want to receive." in frontend
          assert ".notifications-back-link" in css
          assert ".notification-setting-description" in css

          settings_options = frontend.split("const SETTINGS_OPTIONS = [", 1)[1].split("];", 1)[0].lower()
          for internal_wording in ("tracked", "loggable", "14 days"):
              assert internal_wording not in settings_options
          '''
          test = replace_once(test, marker, addition, 'notification contract assertions')
          test_path.write_text(test)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Validate syntax and notification behavior
        run: |
          node --check static/js/notifications.js
          python -m py_compile notification_engine.py notifications_backend.py notification_worker.py tests/test_notifications.py tests/test_notification_contract.py
          python -m unittest tests.test_notifications
          python tests/test_notification_contract.py
          node tests/test_router.js
          node tests/test_nav_font_delivery.js
          python -m unittest tests.test_cache_headers tests.test_route_contracts
      - name: Validate Tailwind source without accepting unrelated generated churn
        run: |
          cp static/css/tailwind.css /tmp/notification-ui-runtime.css
          npm run css:build
          cp /tmp/notification-ui-runtime.css static/css/tailwind.css
      - name: Commit UI polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/js/notifications.js static/css/tailwind-input.css static/css/tailwind.css tests/test_notification_contract.py
          git commit -m "Polish notification navigation and descriptions"
          git push origin HEAD:fix/notification-ui-copy-and-back
