name: Temp data integrity report (remove after use)

on:
  workflow_dispatch:
    inputs:
      tmdb-title:
        description: Title to resolve TMDB candidates for
        required: false
        default: Monster

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare remote inputs
        id: report-inputs
        env:
          ALWAYSDATA_APP_DIR: ${{ secrets.ALWAYSDATA_APP_DIR }}
        run: |
          set -eu
          case "$ALWAYSDATA_APP_DIR" in
            /*) ;;
            *) echo "ALWAYSDATA_APP_DIR must be an absolute path" >&2; exit 1 ;;
          esac
          APP_DIR_B64="$(printf '%s' "$ALWAYSDATA_APP_DIR" | base64 -w 0)"
          echo "::add-mask::$APP_DIR_B64"
          printf 'app_dir_b64=%s\n' "$APP_DIR_B64" >> "$GITHUB_OUTPUT"
      - name: Run read-only data integrity report on server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          APP_DIR_B64: ${{ steps.report-inputs.outputs.app_dir_b64 }}
          TMDB_TITLE: ${{ github.event.inputs.tmdb-title }}
        with:
          host: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          username: ${{ secrets.ALWAYSDATA_SSH_USER }}
          key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          envs: APP_DIR_B64,TMDB_TITLE
          script: |
            set -eu
            TMDB_TITLE="${TMDB_TITLE:-Monster}"
            APP_DIR="$(printf '%s' "$APP_DIR_B64" | base64 -d)"
            case "$APP_DIR" in
              /*) ;;
              *) echo "Decoded app directory must be absolute" >&2; exit 1 ;;
            esac
            test -d "$APP_DIR"
            REPORT_DIR=/tmp/tv-report-tools
            cleanup() {
              rm -rf "$REPORT_DIR"
              git -C "$APP_DIR" update-ref -d refs/remotes/tmp-data-report >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            rm -rf "$REPORT_DIR"
            mkdir -p "$REPORT_DIR"
            git -C "$APP_DIR" fetch --no-tags origin refs/heads/architecture-cleanup:refs/remotes/tmp-data-report
            git -C "$APP_DIR" archive refs/remotes/tmp-data-report tools tvtracker | tar -x -C "$REPORT_DIR"
            cd "$REPORT_DIR"
            PYTHONPATH="$REPORT_DIR" python tools/data_repair_report.py --tmdb-candidates "$TMDB_TITLE"
