name: Media Details native composition patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Remove retired page composers and wire typed model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          template_path = Path('templates/index.html')
          template = template_path.read_text()
          state_line = "<script src=\"{{ url_for('static', filename='js/media-details-state-bridge.js') }}\"></script>"
          node_line = "<script src=\"{{ url_for('static', filename='js/media-details-node-model.js') }}\"></script>"
          if node_line not in template:
              if state_line not in template:
                  raise SystemExit('media details state bridge marker missing')
              template = template.replace(state_line, state_line + "\n" + node_line, 1)
              template_path.write_text(template)

          ui_path = Path('static/js/ui.js')
          ui = ui_path.read_text()

          def remove_block(source, start_marker, end_marker):
              if start_marker not in source:
                  return source
              start = source.index(start_marker)
              try:
                  end = source.index(end_marker, start)
              except ValueError as exc:
                  raise SystemExit(f'end marker missing for {start_marker}') from exc
              return source[:start] + source[end:]

          ui = remove_block(
              ui,
              'function renderMovieDetailPageHTML(state){',
              'function getShowMetaHTML(show,year,genres,ratingHTML){'
          )
          ui = remove_block(
              ui,
              'function renderShowDetailsPageHTML(show,options={}){',
              'function renderShowModal(show){'
          )
          ui_path.write_text(ui)

          audit_path = Path('docs/architecture/FRONTEND_OWNERSHIP_AUDIT.md')
          if audit_path.exists():
              audit = audit_path.read_text()
              audit = audit.replace(
                  '| Show details | Vue final live owner through `show-details-vue-bridge.js` | `renderShowDetailsPageHTML`, detail events, tracker/provider services | RETAIN COMPOSER — bridge still consumes the legacy HTML composer |',
                  '| Show details | Vue native page shell through `show-details-vue-bridge.js` + typed detail-node model | detail events, tracker/provider services, shared fragment helpers | PAGE COMPOSER REMOVED — shared helpers remain service/fragment dependencies until final `ui.js` cleanup |'
              )
              audit = audit.replace(
                  '| Movie details | Vue final live owner through `movie-details-vue-bridge.js` | `renderMovieDetailPageHTML`, detail events, provider services | RETAIN COMPOSER — bridge still consumes the legacy HTML composer |',
                  '| Movie details | Vue native page shell through `movie-details-vue-bridge.js` + typed detail-node model | detail events, provider services, shared fragment helpers | PAGE COMPOSER REMOVED — shared helpers remain service/fragment dependencies until final `ui.js` cleanup |'
              )
              audit_path.write_text(audit)
          PY
      - run: npm ci --audit=false
      - name: Build committed Vue assets
        run: npm run build:frontend
      - name: Run focused media detail contracts
        run: |
          node tests/test_frontend_modernization_show_details_vue_renderer.js
          node tests/test_frontend_modernization_movie_details_vue_renderer.js
      - name: Commit generated native composition checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html static/js/ui.js docs/architecture/FRONTEND_OWNERSHIP_AUDIT.md static/vue
          if git diff --cached --quiet; then
            echo "Native composition checkpoint already applied"
          else
            git commit -m "Complete Vue-native media details page composition"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
