name: Temporary Phase 12 assertion repair

on:
  push:
    branches:
      - fix/remove-placeholder-branding

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair Phase 12 branding assertion') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-placeholder-branding
          fetch-depth: 0
      - name: Restore safety harness and patch only branding assertion
        run: |
          git fetch origin main
          git checkout origin/main -- tests/test_phase12_safety_harness.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_phase12_safety_harness.py')
          source = path.read_text(encoding='utf-8')
          old = '                self.assertIn("TV Tracker — Access", logged_out_dom)\n                self.assertIn(\'id="login-panel"\', logged_out_dom)'
          new = '                self.assertIn("<title>Sign in</title>", logged_out_dom)\n                self.assertIn(">WELCOME</h1>", logged_out_dom)\n                self.assertIn(\'id="login-panel"\', logged_out_dom)'
          if old not in source:
              raise SystemExit('Expected Phase 12 login assertion was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          rm .github/workflows/temporary-restore-phase12-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_phase12_safety_harness.py .github/workflows/temporary-restore-phase12-test.yml
          git commit -m "Repair Phase 12 branding assertion"
          git push origin HEAD:fix/remove-placeholder-branding
