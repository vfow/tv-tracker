name: PR73 Build Show Details Vue

on:
  push:
    branches:
      - frontend-modernization-show-details-vue-renderer
    paths:
      - .github/workflows/pr73-build-show-details-vue.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Show Details branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: frontend-modernization-show-details-vue-renderer
          fetch-depth: 0

      - name: Split legacy Show Details DOM boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path('static/js/ui.js')
          source = path.read_text(encoding='utf-8')
          start = source.index('function renderShowDetailsPage(show,options={}){')
          end = source.index('\nfunction renderShowModal(show){', start)
          block = source[start:end]

          old_prefix = '''function renderShowDetailsPage(show,options={}){
              const content = document.getElementById("show-detail-content");

              if(!content || !show){
                  return;
              }

              const isTracked = !!(DATA.shows && DATA.shows[String(show.tmdb_id)]);'''
          new_prefix = '''function renderShowDetailsPageHTML(show,options={}){
              if(!show){
                  return "";
              }

              const isTracked = !!(DATA.shows && DATA.shows[String(show.tmdb_id)]);'''
          if old_prefix not in block:
              raise SystemExit('Expected Show Details renderer prefix not found')
          html_block = block.replace(old_prefix, new_prefix, 1)
          if '    content.innerHTML = `' not in html_block:
              raise SystemExit('Expected Show Details innerHTML write not found')
          html_block = html_block.replace('    content.innerHTML = `', '    return `', 1)
          old_suffix = '''    `;

              attachShowDetailsPageEvents(show,isTracked);
              attachV2ShowModalEvents(show);
          }'''
          new_suffix = '''    `;
          }'''
          if old_suffix not in html_block:
              raise SystemExit('Expected Show Details interaction suffix not found')
          html_block = html_block.replace(old_suffix, new_suffix, 1)

          wrapper = '''function renderShowDetailsPage(show,options={}){
              const content = document.getElementById("show-detail-content");

              if(!content || !show){
                  return;
              }

              const isTracked = !!(DATA.shows && DATA.shows[String(show.tmdb_id)]);
              content.innerHTML = renderShowDetailsPageHTML(show,options);
              attachShowDetailsPageEvents(show,isTracked);
              attachV2ShowModalEvents(show);
          }
          '''
          source = source[:start] + html_block + '\n\n' + wrapper + source[end:]
          path.write_text(source, encoding='utf-8')

      - name: Wire Show Details Vue owner
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/main.ts')
          source = path.read_text(encoding='utf-8')
          old = "import MovieDetails from './media-details/MovieDetails.vue';\nimport type { MovieDetailsVueBridge, MovieDetailsVueOwner, MovieDetailsViewModel } from './media-details/movieViewModel';"
          new = old + "\nimport ShowDetails from './media-details/ShowDetails.vue';\nimport type { ShowDetailsVueBridge, ShowDetailsVueOwner, ShowDetailsViewModel } from './media-details/showViewModel';"
          if old not in source:
              raise SystemExit('Movie Details import anchor not found')
          source = source.replace(old, new, 1)

          old = '    TVTrackerMovieDetailsVueBridge?: MovieDetailsVueBridge;\n'
          new = old + '    TVTrackerShowDetailsVueBridge?: ShowDetailsVueBridge;\n'
          if old not in source:
              raise SystemExit('Window Movie Details bridge anchor not found')
          source = source.replace(old, new, 1)

          old = 'let movieDetailsApp: VueApp<Element> | null = null;\nlet movieDetailsRoot: Element | null = null;\n'
          new = old + 'let showDetailsApp: VueApp<Element> | null = null;\nlet showDetailsRoot: Element | null = null;\n'
          if old not in source:
              raise SystemExit('Movie Details app state anchor not found')
          source = source.replace(old, new, 1)

          old = '''function unmountMovieDetails(): void {
            if (movieDetailsApp) movieDetailsApp.unmount();
            movieDetailsApp = null;
            movieDetailsRoot = null;
          }
          '''
          new = old + '''
          function unmountShowDetails(): void {
            if (showDetailsApp) showDetailsApp.unmount();
            showDetailsApp = null;
            showDetailsRoot = null;
          }
          '''
          if old not in source:
              raise SystemExit('Movie Details unmount anchor not found')
          source = source.replace(old, new, 1)

          old = '''    if (!root) return;
              unmountMovieDetails();
              root.replaceChildren();
              movieDetailsRoot = root;'''
          new = '''    if (!root) return;
              unmountShowDetails();
              unmountMovieDetails();
              root.replaceChildren();
              movieDetailsRoot = root;'''
          if old not in source:
              raise SystemExit('Movie Details owner anchor not found')
          source = source.replace(old, new, 1)

          marker = '''const movieDetailsOwner: MovieDetailsVueOwner = Object.freeze({
            render(model: MovieDetailsViewModel): void {
              const root = document.getElementById('show-detail-content');
              if (!root) return;
              unmountShowDetails();
              unmountMovieDetails();
              root.replaceChildren();
              movieDetailsRoot = root;
              movieDetailsApp = createApp(MovieDetails, { model });
              movieDetailsApp.mount(root);
            },
            unmount: unmountMovieDetails
          });
          '''
          addition = marker + '''
          const showDetailsOwner: ShowDetailsVueOwner = Object.freeze({
            render(model: ShowDetailsViewModel): void {
              const root = document.getElementById('show-detail-content');
              if (!root) return;
              unmountMovieDetails();
              unmountShowDetails();
              root.replaceChildren();
              showDetailsRoot = root;
              showDetailsApp = createApp(ShowDetails, { model });
              showDetailsApp.mount(root);
            },
            unmount: unmountShowDetails
          });
          '''
          if marker not in source:
              raise SystemExit('Movie Details owner block not found')
          source = source.replace(marker, addition, 1)

          old = 'window.TVTrackerMovieDetailsVueBridge?.attachVueOwner(movieDetailsOwner);\n'
          new = old + 'window.TVTrackerShowDetailsVueBridge?.attachVueOwner(showDetailsOwner);\n'
          if old not in source:
              raise SystemExit('Movie Details attach anchor not found')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

      - name: Load Show Details Vue bridge before router
        shell: python
        run: |
          from pathlib import Path

          path = Path('templates/index.html')
          source = path.read_text(encoding='utf-8')
          old = '''<script src="{{ url_for('static', filename='js/movie-details-vue-bridge.js') }}"></script>'''
          new = old + '''
          <script src="{{ url_for('static', filename='js/show-details-vue-bridge.js') }}"></script>'''
          if old not in source:
              raise SystemExit('Movie Details bridge script anchor not found')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

      - name: Install frontend dependencies
        run: npm ci --audit=false

      - name: Typecheck and build shared Vue entry
        run: npm run build:frontend

      - name: Run Show Details parity test
        run: node tests/test_frontend_modernization_show_details_vue_renderer.js

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit Show Details Vue handoff
        shell: bash
        run: |
          set -euo pipefail
          git add static/js/ui.js frontend/src/main.ts templates/index.html static/vue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Move Show Details DOM rendering to Vue'
          git push origin HEAD:frontend-modernization-show-details-vue-renderer
