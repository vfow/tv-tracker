name: PR71 Load Media Details State Bridge

on:
  push:
    branches:
      - frontend-modernization-media-details-contract
    paths:
      - .github/workflows/pr71-load-media-details-state-bridge.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Media Details branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: frontend-modernization-media-details-contract
          fetch-depth: 0
      - name: Load read-only Media Details bridge after app state
        shell: python
        run: |
          from pathlib import Path
          path = Path('templates/index.html')
          source = path.read_text(encoding='utf-8')
          anchor = "<script src=\"{{ url_for('static', filename='js/app.js') }}\"></script>\n"
          addition = anchor + "<script src=\"{{ url_for('static', filename='js/media-details-state-bridge.js') }}\"></script>\n"
          if "filename='js/media-details-state-bridge.js'" not in source:
              if anchor not in source:
                  raise SystemExit('app.js script anchor not found')
              source = source.replace(anchor, addition, 1)
              path.write_text(source, encoding='utf-8')
      - name: Commit template wiring
        shell: bash
        run: |
          set -euo pipefail
          git add templates/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Load Media Details state bridge after app state'
          git push origin HEAD:frontend-modernization-media-details-contract
