version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    groups:
      python-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    groups:
      npm-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    groups:
      actions-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
